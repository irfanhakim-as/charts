{{- $httpRoute := .Values.httpRoute.enabled }}
{{- $gatewayName := .Values.httpRoute.gatewayName | default "envoy-gateway" | toString | quote }}
{{- $gatewayNamespace := .Values.httpRoute.gatewayNamespace | default "envoy-gateway-system" | toString | quote }}
{{- $backendTrafficPolicy := .Values.httpRoute.backendTrafficPolicy }}
{{- $securityPolicy := .Values.httpRoute.securityPolicy }}
{{- $domain := .Values.chartName.domain | toString }}
{{- $wwwDomain := printf "www.%s" $domain | toString | quote }}
{{- $www := .Values.httpRoute.www }}
{{- $port := .Values.service.port | default "80" | toString }}
{{- if and $httpRoute $domain }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-chartName-httproute
  labels:
    {{- include "chartName.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ $domain | quote }}
  {{- if $www }}
    - {{ $wwwDomain }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-chartName-svc
          port: {{ int $port }}
{{- if $backendTrafficPolicy }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Release.Name }}-chartName-backendtrafficpolicy
  labels:
    {{- include "chartName.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-chartName-httproute
  {{- toYaml $backendTrafficPolicy | nindent 2 }}
{{- end }}
{{- if $securityPolicy }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-chartName-securitypolicy
  labels:
    {{- include "chartName.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-chartName-httproute
  {{- toYaml $securityPolicy | nindent 2 }}
{{- end }}
{{- end }}
