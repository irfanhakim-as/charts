{{- $httpRoute := .Values.httpRoute.enabled }}
{{- $domains := .Values.httpRoute.domains }}
{{- $services := .Values.services }}
{{- $gatewayName := .Values.httpRoute.gatewayName | default "envoy-gateway" | toString | quote }}
{{- $gatewayNamespace := .Values.httpRoute.gatewayNamespace | default "envoy-gateway-system" | toString | quote }}
{{- $defaultBackendTrafficPolicy := .Values.httpRoute.backendTrafficPolicy | default dict }}
{{- $defaultSecurityPolicy := .Values.httpRoute.securityPolicy | default dict }}
{{- $releaseName := .Release.Name | toString }}
{{- if and $httpRoute $services $domains }}
{{- range $domains }}
{{- $www := .www }}
{{- $backendTrafficPolicy := mustMergeOverwrite (deepCopy $defaultBackendTrafficPolicy) (.backendTrafficPolicy | default dict) }}
{{- $securityPolicy := mustMergeOverwrite (deepCopy $defaultSecurityPolicy) (.securityPolicy | default dict) }}
{{- $name := .name | toString }}
{{- $port := .port | toString }}
{{- $servicePort := 0 }}
{{- range $services }}
{{- if eq (.name | toString) $port }}
{{- $servicePort = .port | int }}
{{- end }}
{{- end }}
{{- if not $servicePort }}
{{- fail (printf "domain %s routes to service %s, which is not defined in services" $name $port) }}
{{- end }}
{{- $wwwDomain := printf "www.%s" $name | toString | quote }}
{{- $routeName := printf "%s-%s-extsvc-httproute" $releaseName ($name | replace "." "-") }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  labels:
    {{- include "external-svc.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ $name | quote }}
  {{- if $www }}
    - {{ $wwwDomain }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $releaseName }}-{{ $port }}-extsvc-svc
          port: {{ $servicePort }}
{{- if $backendTrafficPolicy }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $releaseName }}-{{ $name | replace "." "-" }}-extsvc-backendtrafficpolicy
  labels:
    {{- include "external-svc.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $routeName }}
  {{- toYaml $backendTrafficPolicy | nindent 2 }}
{{- end }}
{{- if $securityPolicy }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $releaseName }}-{{ $name | replace "." "-" }}-extsvc-securitypolicy
  labels:
    {{- include "external-svc.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $routeName }}
  {{- toYaml $securityPolicy | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
