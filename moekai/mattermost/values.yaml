# Default values for mattermost.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The desired number of running replicas for Mattermost.
# Default: "1"
replicaCount: ""

# Annotations to be applied to Mattermost pods.
# Example:
# podAnnotations:
#   reloader.stakater.com/auto: "true"
podAnnotations: {}

# Container images used for Mattermost.
image:
  # Mattermost container image configurations.
  # Source: https://hub.docker.com/r/mattermost/mattermost-team-edition
  mattermost:
    # The registry where the Mattermost container image is hosted.
    # Default: "docker.io"
    registry: ""
    # The name of the repository that contains the Mattermost container image used.
    # Default: "mattermost/mattermost-team-edition"
    repository: ""
    # The tag that specifies the version of the Mattermost container image used.
    # Default: Chart appVersion
    tag: ""
    # The policy that determines when Kubernetes should pull the Mattermost container image.
    # Default: "IfNotPresent"
    pullPolicy: ""
  # Init container image configurations.
  # Source: https://hub.docker.com/_/busybox
  init:
    # The registry where the Init container image is hosted.
    # Default: "docker.io"
    registry: ""
    # The name of the repository that contains the Init container image used.
    # Default: "busybox"
    repository: ""
    # The tag that specifies the version of the Init container image used.
    # Default: "1.36.1"
    tag: ""
    # The policy that determines when Kubernetes should pull the Init container image.
    # Default: "IfNotPresent"
    pullPolicy: ""

# Credentials used to securely authenticate and authorise the pulling of container images from private registries.
# Example:
# imagePullSecrets:
#   - name: "ghcr-token-secret"
imagePullSecrets: []

# Mattermost configurations.
mattermost:
  # The ingress domain name that hosts the Mattermost server.
  # Note: Setting this silently defaults "push.sendPushNotifications" and "push.pushNotificationServer" to off/empty unless both are explicitly set.
  # Example:
  # domain: "mattermost.example.com"
  domain: ""
  # The timezone used by the Mattermost server for time-based operations.
  # Example:
  # timezone: "Asia/Kuala_Lumpur"
  timezone: ""
  # Custom init script to run before the Mattermost container starts.
  # Example:
  # initScript: >-
  #   echo "Hello, World!"
  #   echo "This is a custom init script."
  initScript: ""

# Mail configurations.
mail:
  # SMTP server configurations.
  smtp:
    # The hostname or IP address of the SMTP server for sending emails.
    # Example:
    # host: "smtp.gmail.com"
    host: ""
    # The port number on the SMTP server used for sending emails.
    # Default: "587"
    # Example:
    # port: "465"
    port: ""
    # The username for authenticating with the SMTP server.
    # Example:
    # user: "mattermost@example.com"
    user: ""
    # The password for authenticating with the SMTP server.
    # Example:
    # password: "password"
    password: ""
  # The email address used in the "from" and "reply-to" address for sent emails.
  # Default: "${.smtp.user}"
  # Example:
  # feedbackEmail: "no-reply@example.com"
  feedbackEmail: ""

# Push notification configurations.
push:
  # Specifies whether to enable push notifications to mobile clients.
  # Default: "false"
  # Example:
  # sendPushNotifications: "true"
  sendPushNotifications: ""
  # The push notification server used to relay push notifications to mobile clients.
  # Example:
  # pushNotificationServer: "https://push-test.mattermost.com"
  pushNotificationServer: ""

# S3-compatible file storage configurations.
s3:
  # The access key ID used to authenticate with the S3-compatible file storage.
  # Example:
  # accessKeyId: "accesskey"
  accessKeyId: ""
  # The secret access key used to authenticate with the S3-compatible file storage.
  # Example:
  # secretAccessKey: "secretkey"
  secretAccessKey: ""
  # The name of the bucket used for storing Mattermost files.
  # Example:
  # bucket: "mattermost"
  bucket: ""
  # The bare hostname of the S3-compatible file storage endpoint.
  # Example:
  # endpoint: "s3.example.com"
  endpoint: ""
  # The region of the S3-compatible file storage.
  # Example:
  # region: "us-east-1"
  region: ""
  # Specifies whether to use a secure TLS connection when connecting to the S3-compatible file storage.
  # Default: "true"
  # Example:
  # ssl: "false"
  ssl: ""

# Database configurations.
db:
  # The database engine or backend being used by Mattermost.
  # Default: "postgres"
  # Example:
  # type: "mysql"
  type: ""
  # The hostname or IP address of the Mattermost database server.
  # Example:
  # host: "mattermost.default.svc.cluster.local"
  host: ""
  # The port number the Mattermost database server is listening for connections.
  # Default: "5432"
  # Example:
  # port: "3306"
  port: ""
  # The name of the database being used by Mattermost.
  # Example:
  # name: "mattermost"
  name: ""
  # The username or user account for accessing the Mattermost database.
  # Example:
  # user: "root"
  user: ""
  # The password associated with the Mattermost database user.
  # Example:
  # password: "password"
  password: ""
  # Specifies whether to use a secure TLS connection when connecting to the database.
  # Default: "disable"
  # Example:
  # sslMode: "require"
  sslMode: ""
  # The number of seconds to wait before timing out when connecting to the database.
  # Default: "10"
  # Example:
  # connectTimeout: "30"
  connectTimeout: ""

# Ingress configurations.
ingress:
  # Specifies whether Ingress should be enabled for hosting Mattermost services.
  # Example:
  # enabled: true
  enabled: false
  # The name of the cluster issuer for Ingress.
  # Default: "letsencrypt-dns-prod"
  # Example:
  # clusterIssuer: "letsencrypt-http-prod"
  clusterIssuer: ""
  # Specifies whether the WWW subdomain should be enabled.
  # Example:
  # www: true
  www: false
  # Additional configuration annotations to be added to the Ingress resource.
  # Items: `.prefix`, `.name`, `.value`
  # Example:
  # customAnnotations:
  #   # The prefix of the annotation.
  #   # Default: "nginx.ingress.kubernetes.io"
  #   # Example:
  #   # prefix: "nginx.org"
  #   - prefix: ""
  #   # The name of the annotation.
  #   # Example:
  #   # name: "proxy-connect-timeout"
  #     name: ""
  #   # The value of the annotation.
  #   # Example:
  #   # value: "120"
  #     value: ""
  customAnnotations: []

# Service configurations.
service:
  # The optional node port to expose when the service type is NodePort.
  # Example:
  # nodePort: "32000"
  nodePort: ""
  # The port on which the Mattermost server should listen for connections.
  # Default: "8065"
  # Example:
  # port: "8080"
  port: ""
  # The type of service used to expose Mattermost services.
  # Default: "ClusterIP"
  # Example:
  # type: "NodePort"
  type: ""

# Storage configurations.
storage:
  # Data storage configurations.
  data:
    # Specifies whether persistent storage should be provisioned for data storage.
    # Example:
    # enabled: true
    enabled: false
    # The access mode defining how the data storage can be mounted.
    # Default: "ReadWriteOnce"
    # Example:
    # accessMode: "ReadWriteMany"
    accessMode: ""
    # The path where the data storage should be mounted on the container.
    # Default: "/mattermost/data"
    # Example:
    # mountPath: "/data"
    mountPath: ""
    # The subpath within the data storage to mount to the container. Leave empty if not required.
    # Example:
    # subPath: "Data"
    subPath: ""
    # The default amount of persistent storage allocated for the data storage.
    # Default: "1Gi"
    # Example:
    # storage: "10Gi"
    storage: ""
    # The storage class name used for dynamically provisioning a persistent volume for the data storage.
    # Default: "longhorn"
    # Example:
    # storageClassName: "smb"
    storageClassName: ""
  # Log storage configurations.
  log:
    # Specifies whether persistent storage should be provisioned for log storage.
    # Example:
    # enabled: true
    enabled: false
    # The access mode defining how the log storage can be mounted.
    # Default: "ReadWriteOnce"
    # Example:
    # accessMode: "ReadWriteMany"
    accessMode: ""
    # The path where the log storage should be mounted on the container.
    # Default: "/mattermost/logs"
    # Example:
    # mountPath: "/log"
    mountPath: ""
    # The subpath within the log storage to mount to the container. Leave empty if not required.
    # Example:
    # subPath: "Log"
    subPath: ""
    # The default amount of persistent storage allocated for the log storage.
    # Default: "1Gi"
    # Example:
    # storage: "10Gi"
    storage: ""
    # The storage class name used for dynamically provisioning a persistent volume for the log storage.
    # Default: "longhorn"
    # Example:
    # storageClassName: "smb"
    storageClassName: ""

# Health probes configurations.
probes:
  # Mattermost container health probes.
  mattermost:
    # Startup probe to check if the Mattermost container has started successfully.
    startup:
      # Specifies whether to enable the startup probe for the Mattermost container.
      # Example:
      # enabled: true
      enabled: false
      # The specification defining how the startup probe checks the Mattermost container health.
      # Example:
      # spec:
      #   httpGet:
      #     path: /api/v4/system/ping
      #     port: mattermost
      #   initialDelaySeconds: 10
      #   periodSeconds: 10
      #   timeoutSeconds: 5
      #   failureThreshold: 30
      #   successThreshold: 1
      spec: {}
    # Liveness probe to check if the Mattermost container is running properly.
    liveness:
      # Specifies whether to enable the liveness probe for the Mattermost container.
      # Example:
      # enabled: true
      enabled: false
      # The specification defining how the liveness probe checks the Mattermost container health.
      # Note: A default probe configuration will be used if not set for the container.
      # Example:
      # spec:
      #   httpGet:
      #     path: /api/v4/system/ping
      #     port: mattermost
      #   initialDelaySeconds: 10
      #   periodSeconds: 10
      #   timeoutSeconds: 5
      #   failureThreshold: 3
      #   successThreshold: 1
      spec: {}
    # Readiness probe to check if the Mattermost container is ready to serve requests.
    readiness:
      # Specifies whether to enable the readiness probe for the Mattermost container.
      # Example:
      # enabled: true
      enabled: false
      # The specification defining how the readiness probe checks the Mattermost container health.
      # Note: A default probe configuration will be used if not set for the container.
      # Example:
      # spec:
      #   httpGet:
      #     path: /api/v4/system/ping
      #     port: mattermost
      #   initialDelaySeconds: 10
      #   periodSeconds: 5
      #   timeoutSeconds: 5
      #   failureThreshold: 6
      #   successThreshold: 1
      spec: {}

# Resource requirements and limits for Mattermost containers.
resources:
  # Mattermost container resources.
  # Example:
  # mattermost:
  #   # The minimum amount of resources required by Mattermost to run.
  #   requests:
  #     # The minimum amount of CPU resources required by Mattermost.
  #     # Example:
  #     # cpu: "10m"
  #     cpu: "250m"
  #     # The minimum amount of memory required by Mattermost.
  #     # Example:
  #     # memory: "10Mi"
  #     memory: "512Mi"
  #   # The maximum amount of resources allowed for Mattermost.
  #   limits:
  #     # The maximum amount of CPU resources allowed for Mattermost.
  #     # Example:
  #     # cpu: "250m"
  #     cpu: "1500m"
  #     # The maximum amount of memory allowed for Mattermost.
  #     # Example:
  #     # memory: "250Mi"
  #     memory: "1024Mi"
  mattermost: {}
