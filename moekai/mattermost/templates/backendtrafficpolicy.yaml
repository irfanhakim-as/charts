{{- $domain := include "mattermost.httpRouteDomain" . }}
{{- $spec := include "mattermost.httpRouteBackendTrafficPolicy" . }}
{{- if and $domain $spec }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Release.Name }}-mattermost-backendtrafficpolicy
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-mattermost-httproute
  {{- $spec | nindent 2 }}
{{- end }}
