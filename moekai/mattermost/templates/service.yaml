{{- $type := include "mattermost.serviceType" . }}
{{- $port := include "mattermost.servicePort" . }}
{{- $nodePort := include "mattermost.serviceNodePort" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mattermost-svc
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  type: {{ $type }}
  ports:
    - port: {{ int $port }}
      targetPort: mattermost
    {{- if $nodePort }}
      nodePort: {{ int $nodePort }}
    {{- end }}
      protocol: TCP
      name: mattermost
  selector:
    {{- include "mattermost.selectorLabels" . | nindent 4 }}
