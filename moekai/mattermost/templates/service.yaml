{{- $type := .Values.service.type | default "ClusterIP" | toString }}
{{- $port := .Values.service.port | default "8065" | toString }}
{{- $nodePort := .Values.service.nodePort | toString }}
{{- $nodePort = ternary $nodePort "" (and (eq $type "NodePort") (ne $nodePort "")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mattermost-svc
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  type: {{ $type }}
  ports:
    - port: {{ int $port }}
      targetPort: mattermost
    {{- if $nodePort }}
      nodePort: {{ int $nodePort }}
    {{- end }}
      protocol: TCP
      name: mattermost
  selector:
    {{- include "mattermost.selectorLabels" . | nindent 4 }}
