{{- $mattermost_registry := include "mattermost.imageRegistry" . }}
{{- $mattermost_repository := include "mattermost.imageRepository" . }}
{{- $mattermost_tag := include "mattermost.imageTag" . }}
{{- $mattermost_pullPolicy := include "mattermost.imagePullPolicy" . | quote }}
{{- $init_registry := include "mattermost.initImageRegistry" . }}
{{- $init_repository := include "mattermost.initImageRepository" . }}
{{- $init_tag := include "mattermost.initImageTag" . }}
{{- $init_pullPolicy := include "mattermost.initImagePullPolicy" . | quote }}
{{- $replica_count := include "mattermost.replicaCount" . }}
{{- $initScript := include "mattermost.initScript" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mattermost
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  replicas: {{ int $replica_count }}
  selector:
    matchLabels:
      {{- include "mattermost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mattermost.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $initScript }}
      initContainers:
        - name: init
          image: {{ printf "%s/%s:%s" $init_registry $init_repository $init_tag | quote }}
          imagePullPolicy: {{ $init_pullPolicy }}
          command: ["/bin/sh"]
          args:
            - -c
            - |
              {{- $initScript | nindent 14 }}
          {{- include "mattermost.volumeMounts" . | nindent 10 }}
      {{- end }}
      containers:
        - name: mattermost
          image: {{ printf "%s/%s:%s" $mattermost_registry $mattermost_repository $mattermost_tag | quote }}
          imagePullPolicy: {{ $mattermost_pullPolicy }}
          ports:
            - name: mattermost
              containerPort: 8065
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.mattermost | nindent 12 }}
          {{- with include "mattermost.startupProbe" . }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with include "mattermost.livenessProbe" . }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with include "mattermost.readinessProbe" . }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-mattermost-cm
            - secretRef:
                name: {{ .Release.Name }}-mattermost-secret
          {{- include "mattermost.volumeMounts" . | nindent 10 }}
      {{- include "mattermost.volumes" . | nindent 6 }}
