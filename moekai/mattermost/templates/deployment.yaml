{{- $dataPersistence := eq (include "mattermost.dataPersistence" .) "true" }}
{{- $logPersistence := eq (include "mattermost.logPersistence" .) "true" }}
{{- $mattermostStartupProbe := .Values.probes.mattermost.startup.enabled }}
{{- $mattermostStartupProbeSpec := .Values.probes.mattermost.startup.spec }}
{{- $mattermostLivenessProbe := .Values.probes.mattermost.liveness.enabled }}
{{- $mattermostLivenessProbeSpec := .Values.probes.mattermost.liveness.spec }}
{{- $mattermostReadinessProbe := .Values.probes.mattermost.readiness.enabled }}
{{- $mattermostReadinessProbeSpec := .Values.probes.mattermost.readiness.spec }}
{{- $mattermost_registry := include "mattermost.imageRegistry" . }}
{{- $mattermost_repository := include "mattermost.imageRepository" . }}
{{- $mattermost_tag := include "mattermost.imageTag" . }}
{{- $mattermost_pullPolicy := include "mattermost.imagePullPolicy" . | quote }}
{{- $init_registry := include "mattermost.initImageRegistry" . }}
{{- $init_repository := include "mattermost.initImageRepository" . }}
{{- $init_tag := include "mattermost.initImageTag" . }}
{{- $init_pullPolicy := include "mattermost.initImagePullPolicy" . | quote }}
{{- $replica_count := include "mattermost.replicaCount" . }}
{{- $dataMountPath := include "mattermost.dataMountPath" . | quote }}
{{- $dataSubPath := include "mattermost.dataSubPath" . }}
{{- $logMountPath := include "mattermost.logMountPath" . | quote }}
{{- $logSubPath := include "mattermost.logSubPath" . }}
{{- $initScript := include "mattermost.initScript" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mattermost
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  replicas: {{ int $replica_count }}
  selector:
    matchLabels:
      {{- include "mattermost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mattermost.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $initScript }}
      initContainers:
        - name: init
          image: {{ printf "%s/%s:%s" $init_registry $init_repository $init_tag | quote }}
          imagePullPolicy: {{ $init_pullPolicy }}
          command: ["/bin/sh"]
          args:
            - -c
            - |
              {{- $initScript | nindent 14 }}
          {{- if or $dataPersistence $logPersistence }}
          volumeMounts:
            {{- if $dataPersistence }}
            - name: {{ .Release.Name }}-mattermost-data
              mountPath: {{ $dataMountPath }}
              {{- if $dataSubPath }}
              subPath: {{ $dataSubPath | quote }}
              {{- end }}
            {{- end }}
            {{- if $logPersistence }}
            - name: {{ .Release.Name }}-mattermost-log
              mountPath: {{ $logMountPath }}
              {{- if $logSubPath }}
              subPath: {{ $logSubPath | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
      {{- end }}
      containers:
        - name: mattermost
          image: {{ printf "%s/%s:%s" $mattermost_registry $mattermost_repository $mattermost_tag | quote }}
          imagePullPolicy: {{ $mattermost_pullPolicy }}
          ports:
            - name: mattermost
              containerPort: 8065
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.mattermost | nindent 12 }}
          {{- if and $mattermostStartupProbe $mattermostStartupProbeSpec }}
          startupProbe:
            {{- toYaml $mattermostStartupProbeSpec | nindent 12 }}
          {{- end }}
          {{- if $mattermostLivenessProbe }}
          livenessProbe:
            {{- if $mattermostLivenessProbeSpec }}
              {{- toYaml $mattermostLivenessProbeSpec | nindent 12 }}
            {{- else }}
            httpGet:
              path: /api/v4/system/ping
              port: mattermost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            {{- end }}
          {{- end }}
          {{- if $mattermostReadinessProbe }}
          readinessProbe:
            {{- if $mattermostReadinessProbeSpec }}
              {{- toYaml $mattermostReadinessProbeSpec | nindent 12 }}
            {{- else }}
            httpGet:
              path: /api/v4/system/ping
              port: mattermost
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-mattermost-cm
            - secretRef:
                name: {{ .Release.Name }}-mattermost-secret
          {{- if or $dataPersistence $logPersistence }}
          volumeMounts:
            {{- if $dataPersistence }}
            - name: {{ .Release.Name }}-mattermost-data
              mountPath: {{ $dataMountPath }}
              {{- if $dataSubPath }}
              subPath: {{ $dataSubPath | quote }}
              {{- end }}
            {{- end }}
            {{- if $logPersistence }}
            - name: {{ .Release.Name }}-mattermost-log
              mountPath: {{ $logMountPath }}
              {{- if $logSubPath }}
              subPath: {{ $logSubPath | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
      {{- if or $dataPersistence $logPersistence }}
      volumes:
        {{- if $dataPersistence }}
        - name: {{ .Release.Name }}-mattermost-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mattermost-data-pvc
        {{- end }}
        {{- if $logPersistence }}
        - name: {{ .Release.Name }}-mattermost-log
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mattermost-log-pvc
        {{- end }}
      {{- end }}
