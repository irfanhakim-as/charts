{{- $www := and .Values.ingress.enabled .Values.ingress.www }}
{{- $clusterIssuer := .Values.ingress.clusterIssuer | default "letsencrypt-dns-prod" | toString | quote }}
{{- $customAnnotations := .Values.ingress.customAnnotations }}
{{- $domain := include "mattermost.siteDomain" . }}
{{- $wwwDomain := printf "www.%s" $domain | toString }}
{{- $wwwDomain = ternary $wwwDomain "" (and $www (ne $domain "")) }}
{{- if $domain }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-mattermost-ingress
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $clusterIssuer }}
    cert-manager.io/private-key-algorithm: "ECDSA"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # Mattermost relies on long-lived websocket connections, which the default nginx proxy timeouts (60s)
    # would otherwise silently cut.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.org/client-max-body-size: "100m"
  {{- range $customAnnotations }}
    {{ printf "%s/%s" (.prefix | default "nginx.ingress.kubernetes.io") .name }}: {{ .value | quote }}
  {{- end }}
spec:
  ingressClassName: "nginx"
  rules:
    - host: {{ $domain | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.Name }}-mattermost-svc
                port:
                  name: mattermost
            path: /
            pathType: Prefix
  {{- if $wwwDomain }}
    - host: {{ $wwwDomain | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.Name }}-mattermost-svc
                port:
                  name: mattermost
            path: /
            pathType: Prefix
  {{- end }}
  tls:
    - hosts:
        - {{ $domain | quote }}
      {{- if $wwwDomain }}
        - {{ $wwwDomain | quote }}
      {{- end }}
      secretName: {{ .Release.Name }}-mattermost-tls-cert
{{- end }}
