{{- $db_type := .Values.db.type | default "postgres" | toString }}
{{- $db_user := .Values.db.user | toString }}
{{- $db_password := .Values.db.password | toString }}
{{- $db_host := .Values.db.host | toString }}
{{- $db_port := .Values.db.port | default "5432" | toString }}
{{- $db_name := .Values.db.name | toString }}
{{- $db_sslMode := .Values.db.sslMode | default "disable" | toString }}
{{- $db_connectTimeout := .Values.db.connectTimeout | default "10" | toString }}
{{- $db_url := printf "%s://%s:%s@%s:%s/%s?sslmode=%s&connect_timeout=%s" $db_type $db_user $db_password $db_host $db_port $db_name $db_sslMode $db_connectTimeout }}
{{- $s3AccessKeyId := .Values.s3.accessKeyId | toString }}
{{- $s3SecretAccessKey := .Values.s3.secretAccessKey | toString | b64enc }}
{{- $smtpHost := .Values.mail.smtp.host | toString }}
{{- $smtpUser := .Values.mail.smtp.user | toString | b64enc }}
{{- $smtpPassword := .Values.mail.smtp.password | toString | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mattermost-secret
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
type: Opaque
data:
  MM_SQLSETTINGS_DATASOURCE: {{ $db_url | b64enc }}
{{- if $s3AccessKeyId }}
  MM_FILESETTINGS_AMAZONS3ACCESSKEYID: {{ $s3AccessKeyId | b64enc }}
  MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: {{ $s3SecretAccessKey }}
{{- end }}
{{- if $smtpHost }}
  MM_EMAILSETTINGS_SMTPUSERNAME: {{ $smtpUser }}
  MM_EMAILSETTINGS_SMTPPASSWORD: {{ $smtpPassword }}
{{- end }}
