{{- $db_url := include "mattermost.dbUrl" . }}
{{- $s3AccessKeyId := include "mattermost.s3AccessKeyId" . }}
{{- $s3SecretAccessKey := include "mattermost.s3SecretAccessKey" . | b64enc }}
{{- $smtpHost := include "mattermost.smtpHost" . }}
{{- $smtpUser := include "mattermost.smtpUser" . | b64enc }}
{{- $smtpPassword := include "mattermost.smtpPassword" . | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mattermost-secret
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
type: Opaque
data:
  MM_SQLSETTINGS_DATASOURCE: {{ $db_url | b64enc }}
{{- if $s3AccessKeyId }}
  MM_FILESETTINGS_AMAZONS3ACCESSKEYID: {{ $s3AccessKeyId | b64enc }}
  MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: {{ $s3SecretAccessKey }}
{{- end }}
{{- if $smtpHost }}
  MM_EMAILSETTINGS_SMTPUSERNAME: {{ $smtpUser }}
  MM_EMAILSETTINGS_SMTPPASSWORD: {{ $smtpPassword }}
{{- end }}
