{{- $ingressClassName := include "vaultwarden.ingressClassName" . }}
{{- $tlsSecretName := include "vaultwarden.tlsSecretName" . }}
{{- $domain := include "vaultwarden.ingressDomain" . }}
{{- $wwwDomain := include "vaultwarden.ingressWwwDomain" . }}
{{- if $domain }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-vaultwarden-ingress
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  annotations:
    {{- include "vaultwarden.ingressAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ $ingressClassName | quote }}
  rules:
    - host: {{ $domain | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.Name }}-vaultwarden-svc
                port:
                  name: vaultwarden
            path: /
            pathType: Prefix
  {{- if $wwwDomain }}
    - host: {{ $wwwDomain | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.Name }}-vaultwarden-svc
                port:
                  name: vaultwarden
            path: /
            pathType: Prefix
  {{- end }}
  tls:
    - hosts:
        - {{ $domain | quote }}
      {{- if $wwwDomain }}
        - {{ $wwwDomain | quote }}
      {{- end }}
      secretName: {{ $tlsSecretName | quote }}
{{- end }}
