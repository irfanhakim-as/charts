{{- $dataMountPath := include "vaultwarden.dataMountPath" . | quote }}
{{- $push := include "vaultwarden.pushEnabled" . | quote }}
{{- $domain := include "vaultwarden.ingressDomain" . }}
{{- $serviceAddress := ternary (printf "https://%s" $domain) "http://localhost" (ne $domain "") | quote }}
{{- $send := include "vaultwarden.send" . | quote }}
{{- $clearTrash := include "vaultwarden.clearTrash" . }}
{{- $signup := include "vaultwarden.signupEnabled" . }}
{{- $domainWhitelist := include "vaultwarden.signupDomainWhitelist" . }}
{{- $verification := include "vaultwarden.signupVerification" . }}
{{- $resendInterval := include "vaultwarden.signupResendInterval" . | quote }}
{{- $resendLimit := include "vaultwarden.signupResendLimit" . | quote }}
{{- $invitation := include "vaultwarden.invitationEnabled" . | quote }}
{{- $invitationExpiry := include "vaultwarden.invitationExpiry" . | quote }}
{{- $invitationOrg := include "vaultwarden.invitationOrganisation" . | quote }}
{{- $emailUpdate := include "vaultwarden.emailUpdate" . | quote }}
{{- $emergencyAccess := include "vaultwarden.emergencyAccess" . | quote }}
{{- $expFeatures := include "vaultwarden.expFeatures" . }}
{{- $notifyNewDevice := include "vaultwarden.notifyNewDevice" . | quote }}
{{- $logLevel := include "vaultwarden.logLevel" . | quote }}
{{- $tfaExpiry := include "vaultwarden.tfaExpiry" . | quote }}
{{- $tfaEmailTokenSize := include "vaultwarden.tfaEmailTokenSize" . | quote }}
{{- $tfaEmailExpiry := include "vaultwarden.tfaEmailExpiry" . | quote }}
{{- $tfaEmailLimit := include "vaultwarden.tfaEmailLimit" . | quote }}
{{- $tfaEmailEnforce := include "vaultwarden.tfaEmailEnforce" . | quote }}
{{- $tfaEmailFallback := include "vaultwarden.tfaEmailFallback" . | quote }}
{{- $tfaRememberDevice := ternary "false" "true" (eq (include "vaultwarden.tfaRememberDevice" .) "true") | quote }}
{{- $tfaAllowTimeDrift := ternary "false" "true" (eq (include "vaultwarden.tfaAllowTimeDrift" .) "true") | quote }}
{{- $mailFromEmail := include "vaultwarden.mailFromEmail" . }}
{{- $mailFromName := include "vaultwarden.mailFromName" . | quote }}
{{- $smtpSecurity := include "vaultwarden.smtpSecurity" . | quote }}
{{- $duo := eq (include "vaultwarden.duoEnabled" .) "true" }}
{{- $duoHost := include "vaultwarden.duoHost" . }}
{{- $mail := eq (include "vaultwarden.mailEnabled" .) "true" }}
{{- $smtpHost := include "vaultwarden.smtpHost" . }}
{{- $smtpPort := include "vaultwarden.smtpPort" . | quote }}
{{- $yubico := eq (include "vaultwarden.yubicoEnabled" .) "true" }}
{{- $yubicoServer := include "vaultwarden.yubicoServer" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-vaultwarden-cm
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
data:
  DATA_FOLDER: {{ $dataMountPath }}
  PUSH_ENABLED: {{ $push }}
  DOMAIN: {{ $serviceAddress }}
  SENDS_ALLOWED: {{ $send }}
{{- if $clearTrash }}
  TRASH_AUTO_DELETE_DAYS: {{ $clearTrash | quote }}
{{- end }}
  SIGNUPS_ALLOWED: {{ $signup | quote }}
  SIGNUPS_VERIFY: {{ $verification | quote }}
{{- if eq $verification "true" }}
  SIGNUPS_VERIFY_RESEND_TIME: {{ $resendInterval }}
  SIGNUPS_VERIFY_RESEND_LIMIT: {{ $resendLimit }}
{{- end }}
{{- if $domainWhitelist }}
  SIGNUPS_DOMAINS_WHITELIST: {{ $domainWhitelist | quote }}
{{- end }}
  INVITATIONS_ALLOWED: {{ $invitation }}
  INVITATION_ORG_NAME: {{ $invitationOrg }}
  INVITATION_EXPIRATION_HOURS: {{ $invitationExpiry }}
  EMERGENCY_ACCESS_ALLOWED: {{ $emergencyAccess }}
  EMAIL_CHANGE_ALLOWED: {{ $emailUpdate }}
{{- if $expFeatures }}
  EXPERIMENTAL_CLIENT_FEATURE_FLAGS: {{ $expFeatures | quote }}
{{- end }}
  REQUIRE_DEVICE_EMAIL: {{ $notifyNewDevice }}
  LOG_LEVEL: {{ $logLevel }}
  INCOMPLETE_2FA_TIME_LIMIT: {{ $tfaExpiry }}
  EMAIL_TOKEN_SIZE: {{ $tfaEmailTokenSize }}
  EMAIL_EXPIRATION_TIME: {{ $tfaEmailExpiry }}
  EMAIL_ATTEMPTS_LIMIT: {{ $tfaEmailLimit }}
  EMAIL_2FA_ENFORCE_ON_VERIFIED_INVITE: {{ $tfaEmailEnforce }}
  EMAIL_2FA_AUTO_FALLBACK: {{ $tfaEmailFallback }}
  DISABLE_2FA_REMEMBER: {{ $tfaRememberDevice }}
  AUTHENTICATOR_DISABLE_TIME_DRIFT: {{ $tfaAllowTimeDrift }}
{{- if $mail }}
  SMTP_FROM: {{ $mailFromEmail | quote }}
  SMTP_FROM_NAME: {{ $mailFromName }}
  SMTP_SECURITY: {{ $smtpSecurity }}
{{- end }}
{{- if and $mail $smtpHost }}
  SMTP_HOST: {{ $smtpHost | quote }}
  SMTP_PORT: {{ $smtpPort }}
{{- end }}
{{- with include "vaultwarden.smtpAuthMechanism" . }}
  SMTP_AUTH_MECHANISM: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.smtpTimeout" . }}
  SMTP_TIMEOUT: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.smtpHeloName" . }}
  HELO_NAME: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.smtpEmbedImages" . }}
  SMTP_EMBED_IMAGES: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.smtpDebug" . }}
  SMTP_DEBUG: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.smtpAcceptInvalidCerts" . }}
  SMTP_ACCEPT_INVALID_CERTS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.smtpAcceptInvalidHostnames" . }}
  SMTP_ACCEPT_INVALID_HOSTNAMES: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.sendmailEnabled" . }}
  USE_SENDMAIL: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.sendmailCommand" . }}
  SENDMAIL_COMMAND: {{ . | quote }}
{{- end }}
{{- if and $yubico $yubicoServer }}
  YUBICO_SERVER: {{ $yubicoServer | quote }}
{{- end }}
{{- with include "vaultwarden.ssoEnabled" . }}
  SSO_ENABLED: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoOnly" . }}
  SSO_ONLY: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoSignupsAllowed" . }}
  SSO_SIGNUPS_ALLOWED: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoSignupsMatchEmail" . }}
  SSO_SIGNUPS_MATCH_EMAIL: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoAllowUnknownEmailVerification" . }}
  SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoAuthority" . }}
  SSO_AUTHORITY: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoClientId" . }}
  SSO_CLIENT_ID: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoScopes" . }}
  SSO_SCOPES: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoAuthorizeExtraParams" . }}
  SSO_AUTHORIZE_EXTRA_PARAMS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoPkce" . }}
  SSO_PKCE: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoAudienceTrusted" . }}
  SSO_AUDIENCE_TRUSTED: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoAuthOnlyNotSession" . }}
  SSO_AUTH_ONLY_NOT_SESSION: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoClientCacheExpiration" . }}
  SSO_CLIENT_CACHE_EXPIRATION: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoDebugTokens" . }}
  SSO_DEBUG_TOKENS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.ssoMasterPasswordPolicy" . }}
  SSO_MASTER_PASSWORD_POLICY: {{ . | quote }}
{{- end }}
{{- if and $duo $duoHost }}
  DUO_HOST: {{ $duoHost | quote }}
{{- end }}
{{- with include "vaultwarden.adminDisableToken" . }}
  DISABLE_ADMIN_TOKEN: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.adminSessionLifetime" . }}
  ADMIN_SESSION_LIFETIME: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkPort" . }}
  ROCKET_PORT: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkAddress" . }}
  ROCKET_ADDRESS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkIpHeader" . }}
  IP_HEADER: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkIpHeaderTrustedProxies" . }}
  IP_HEADER_TRUSTED_PROXIES: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkWebsocket" . }}
  ENABLE_WEBSOCKET: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkDnsPreferIpv6" . }}
  DNS_PREFER_IPV6: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkAllowedIframeAncestors" . }}
  ALLOWED_IFRAME_ANCESTORS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.networkAllowedConnectSrc" . }}
  ALLOWED_CONNECT_SRC: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.outboundBlockNonGlobalIps" . }}
  HTTP_REQUEST_BLOCK_NON_GLOBAL_IPS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.outboundBlockRegex" . }}
  HTTP_REQUEST_BLOCK_REGEX: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.rateLimitLoginSeconds" . }}
  LOGIN_RATELIMIT_SECONDS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.rateLimitLoginMaxBurst" . }}
  LOGIN_RATELIMIT_MAX_BURST: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.rateLimitUnauthenticatedSeconds" . }}
  UNAUTHENTICATED_RATELIMIT_SECONDS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.rateLimitUnauthenticatedMaxBurst" . }}
  UNAUTHENTICATED_RATELIMIT_MAX_BURST: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.rateLimitAdminSeconds" . }}
  ADMIN_RATELIMIT_SECONDS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.rateLimitAdminMaxBurst" . }}
  ADMIN_RATELIMIT_MAX_BURST: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.suppressOnboarding" . }}
  CLIENT_SUPPRESS_ONBOARDING: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.fillAssistRulesUrl" . }}
  FILL_ASSIST_RULES_URL: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.limitsUserAttachment" . }}
  USER_ATTACHMENT_LIMIT: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.limitsOrganizationAttachment" . }}
  ORG_ATTACHMENT_LIMIT: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.limitsUserSend" . }}
  USER_SEND_LIMIT: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.limitsIncreaseNoteSize" . }}
  INCREASE_NOTE_SIZE_LIMIT: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.organizationCreationUsers" . }}
  ORG_CREATION_USERS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.organizationEventsEnabled" . }}
  ORG_EVENTS_ENABLED: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.organizationEventsRetainDays" . }}
  EVENTS_DAYS_RETAIN: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.organizationGroupsEnabled" . }}
  ORG_GROUPS_ENABLED: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.organizationEnforceSingleOrgWithResetPasswordPolicy" . }}
  ENFORCE_SINGLE_ORG_WITH_RESET_PW_POLICY: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.passwordIterations" . }}
  PASSWORD_ITERATIONS: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.passwordHintsAllowed" . }}
  PASSWORD_HINTS_ALLOWED: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.passwordShowHint" . }}
  SHOW_PASSWORD_HINT: {{ . | quote }}
{{- end }}
{{- with include "vaultwarden.tfaRememberDays" . }}
  TWO_FACTOR_REMEMBER_DAYS: {{ . | quote }}
{{- end }}
