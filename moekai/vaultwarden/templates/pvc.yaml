{{- $dataPersistence := eq (include "vaultwarden.dataPersistence" .) "true" }}
{{- $dataAccessMode := include "vaultwarden.dataAccessMode" . | quote }}
{{- $dataStorage := include "vaultwarden.dataStorage" . | quote }}
{{- $dataStorageClassName := include "vaultwarden.dataStorageClassName" . | quote }}
{{- if $dataPersistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-vaultwarden-data-pvc
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ $dataAccessMode }}
  resources:
    requests:
      storage: {{ $dataStorage }}
  storageClassName: {{ $dataStorageClassName }}
{{- end }}
