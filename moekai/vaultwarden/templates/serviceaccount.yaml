{{- if eq (include "vaultwarden.serviceAccountCreate" .) "true" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vaultwarden.serviceAccountName" . }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
  {{- with include "vaultwarden.serviceAccountAnnotations" . }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
