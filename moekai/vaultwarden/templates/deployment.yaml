{{- $vaultwardenRegistry := include "vaultwarden.imageRegistry" . }}
{{- $vaultwardenRepository := include "vaultwarden.imageRepository" . }}
{{- $vaultwardenTag := include "vaultwarden.imageTag" . }}
{{- $vaultwardenPullPolicy := include "vaultwarden.imagePullPolicy" . | quote }}
{{- $initRegistry := include "vaultwarden.initImageRegistry" . }}
{{- $initRepository := include "vaultwarden.initImageRepository" . }}
{{- $initTag := include "vaultwarden.initImageTag" . }}
{{- $initPullPolicy := include "vaultwarden.initImagePullPolicy" . | quote }}
{{- $replicaCount := include "vaultwarden.replicaCount" . }}
{{- $serviceAccountName := include "vaultwarden.serviceAccountName" . }}
{{- $existingSecret := include "vaultwarden.existingSecret" . }}
{{- $networkPort := include "vaultwarden.networkPort" . }}
{{- $initScript := include "vaultwarden.initScript" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vaultwarden
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  replicas: {{ int $replicaCount }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vaultwarden.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with include "vaultwarden.podAnnotations" . }}
      {{- . | nindent 6 }}
      {{- end }}
      labels:
        {{- include "vaultwarden.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      {{- with include "vaultwarden.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with include "vaultwarden.podSecurityContext" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with include "vaultwarden.nodeSelector" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with include "vaultwarden.tolerations" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with include "vaultwarden.affinity" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if $initScript }}
      initContainers:
        - name: init
          image: {{ printf "%s/%s:%s" $initRegistry $initRepository $initTag | quote }}
          imagePullPolicy: {{ $initPullPolicy }}
          command: ["/bin/sh"]
          args:
            - -c
            - |
              {{- $initScript | nindent 14 }}
          {{- with include "vaultwarden.volumeMounts" . }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- end }}
      containers:
        - name: vaultwarden
          image: {{ printf "%s/%s:%s" $vaultwardenRegistry $vaultwardenRepository $vaultwardenTag | quote }}
          imagePullPolicy: {{ $vaultwardenPullPolicy }}
          {{- with include "vaultwarden.containerSecurityContext" . }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: vaultwarden
              containerPort: {{ int ($networkPort | default "80") }}
              protocol: TCP
          {{- include "vaultwarden.resources" . | nindent 10 }}
          {{- with include "vaultwarden.startupProbe" . }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with include "vaultwarden.livenessProbe" . }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with include "vaultwarden.readinessProbe" . }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-vaultwarden-cm
            {{- if eq (include "vaultwarden.secretEnabled" .) "true" }}
            - secretRef:
                name: {{ .Release.Name }}-vaultwarden-secret
            {{- end }}
            {{- if $existingSecret }}
            - secretRef:
                name: {{ $existingSecret | quote }}
            {{- end }}
          {{- with include "vaultwarden.extraEnv" . }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with include "vaultwarden.volumeMounts" . }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- with include "vaultwarden.volumes" . }}
      {{- . | nindent 6 }}
      {{- end }}
