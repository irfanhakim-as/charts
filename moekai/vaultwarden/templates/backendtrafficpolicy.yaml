{{- $domain := include "vaultwarden.httpRouteDomain" . }}
{{- $spec := include "vaultwarden.httpRouteBackendTrafficPolicy" . }}
{{- if and $domain $spec }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Release.Name }}-vaultwarden-backendtrafficpolicy
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-vaultwarden-httproute
  {{- $spec | nindent 2 }}
{{- end }}
