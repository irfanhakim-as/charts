{{- $push := include "vaultwarden.pushEnabled" . }}
{{- $pushID := include "vaultwarden.pushId" . | b64enc }}
{{- $pushKey := include "vaultwarden.pushKey" . | b64enc }}
{{- $dbUrl := include "vaultwarden.dbUrl" . }}
{{- $hibpApiKey := include "vaultwarden.hibpApiKey" . | b64enc }}
{{- $adminToken := include "vaultwarden.adminToken" . | b64enc }}
{{- $yubico := include "vaultwarden.yubicoEnabled" . }}
{{- $yubicoID := include "vaultwarden.yubicoId" . | b64enc }}
{{- $yubicoKey := include "vaultwarden.yubicoKey" . | b64enc }}
{{- $yubicoServer := include "vaultwarden.yubicoServer" . | b64enc }}
{{- $smtpHost := include "vaultwarden.smtpHost" . | b64enc }}
{{- $smtpPort := include "vaultwarden.smtpPort" . | b64enc }}
{{- $smtpUser := include "vaultwarden.smtpUser" . }}
{{- $smtpPassword := include "vaultwarden.smtpPassword" . | b64enc }}
{{- $mail := eq (include "vaultwarden.mailEnabled" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-vaultwarden-secret
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ $dbUrl | b64enc }}
{{- if eq $push "true" }}
  PUSH_INSTALLATION_ID: {{ $pushID }}
  PUSH_INSTALLATION_KEY: {{ $pushKey }}
{{- end }}
{{- if $hibpApiKey }}
  HIBP_API_KEY: {{ $hibpApiKey }}
{{- end }}
{{- if $adminToken }}
  ADMIN_TOKEN: {{ $adminToken }}
{{- end }}
{{- if eq $yubico "true" }}
  YUBICO_CLIENT_ID: {{ $yubicoID }}
  YUBICO_SECRET_KEY: {{ $yubicoKey }}
  {{- if $yubicoServer }}
  YUBICO_SERVER: {{ $yubicoServer }}
  {{- end }}
{{- end }}
{{- if $mail }}
  SMTP_HOST: {{ $smtpHost }}
  SMTP_PORT: {{ $smtpPort }}
  SMTP_USERNAME: {{ $smtpUser | b64enc }}
  SMTP_PASSWORD: {{ $smtpPassword }}
{{- end }}
