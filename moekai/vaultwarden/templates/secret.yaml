{{- if eq (include "vaultwarden.secretEnabled" .) "true" }}
{{- $push := include "vaultwarden.pushEnabled" . }}
{{- $pushID := include "vaultwarden.pushId" . }}
{{- $pushKey := include "vaultwarden.pushKey" . }}
{{- $dbUrl := include "vaultwarden.dbUrl" . }}
{{- $hibpApiKey := include "vaultwarden.hibpApiKey" . }}
{{- $adminToken := include "vaultwarden.adminToken" . }}
{{- $yubico := include "vaultwarden.yubicoEnabled" . }}
{{- $yubicoID := include "vaultwarden.yubicoId" . }}
{{- $yubicoKey := include "vaultwarden.yubicoKey" . }}
{{- $smtpUser := include "vaultwarden.smtpUser" . }}
{{- $smtpPassword := include "vaultwarden.smtpPassword" . }}
{{- $mail := eq (include "vaultwarden.mailEnabled" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-vaultwarden-secret
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
data:
{{- if $dbUrl }}
  DATABASE_URL: {{ $dbUrl | b64enc }}
{{- end }}
{{- if eq $push "true" }}
  PUSH_INSTALLATION_ID: {{ $pushID | b64enc }}
  PUSH_INSTALLATION_KEY: {{ $pushKey | b64enc }}
{{- end }}
{{- if $hibpApiKey }}
  HIBP_API_KEY: {{ $hibpApiKey | b64enc }}
{{- end }}
{{- if $adminToken }}
  ADMIN_TOKEN: {{ $adminToken | b64enc }}
{{- end }}
{{- if eq $yubico "true" }}
  YUBICO_CLIENT_ID: {{ $yubicoID | b64enc }}
  YUBICO_SECRET_KEY: {{ $yubicoKey | b64enc }}
{{- end }}
{{- if $mail }}
  SMTP_USERNAME: {{ $smtpUser | b64enc }}
  SMTP_PASSWORD: {{ $smtpPassword | b64enc }}
{{- end }}
{{- end }}
