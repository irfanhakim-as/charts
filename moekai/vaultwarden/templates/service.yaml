{{- $type := include "vaultwarden.serviceType" . }}
{{- $port := include "vaultwarden.servicePort" . }}
{{- $nodePort := include "vaultwarden.serviceNodePort" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vaultwarden-svc
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  type: {{ $type }}
  ports:
    - port: {{ int $port }}
      targetPort: vaultwarden
    {{- if $nodePort }}
      nodePort: {{ int $nodePort }}
    {{- end }}
      protocol: TCP
      name: vaultwarden
  selector:
    {{- include "vaultwarden.selectorLabels" . | nindent 4 }}
