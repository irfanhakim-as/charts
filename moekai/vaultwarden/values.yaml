# Default values for vaultwarden.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The desired number of running replicas for Vaultwarden.
# Default: "1"
replicaCount: ""

# The update strategy used to replace existing pods with new ones.
# Note: Set "type" to "Recreate" if data storage is enabled and mounted as "ReadWriteOnce".
# Example:
# updateStrategy:
#   type: "Recreate"
updateStrategy: {}

# Annotations to be applied to Vaultwarden pods.
# Example:
# podAnnotations:
#   reloader.stakater.com/auto: "true"
podAnnotations: {}

# Security context applied at the pod level for Vaultwarden.
# Note: Set fsGroup for the data storage to be writable when the container runs as a non-root user.
# Example:
# podSecurityContext:
#   fsGroup: 1000
podSecurityContext: {}

# Security context applied at the Vaultwarden container level.
# Note: Running as a non-root user requires a port above 1023 and fsGroup to be set in "podSecurityContext".
# Example:
# containerSecurityContext:
#   runAsUser: 1000
#   runAsGroup: 1000
#   runAsNonRoot: true
containerSecurityContext: {}

# Container images used for Vaultwarden.
image:
  # Vaultwarden container image configurations.
  # Source: https://github.com/dani-garcia/vaultwarden/pkgs/container/vaultwarden
  vaultwarden:
    # The registry where the Vaultwarden container image is hosted.
    # Default: "ghcr.io"
    registry: ""
    # The name of the repository that contains the Vaultwarden container image used.
    # Default: "dani-garcia/vaultwarden"
    repository: ""
    # The tag that specifies the version of the Vaultwarden container image used.
    # Default: Chart appVersion
    tag: ""
    # The policy that determines when Kubernetes should pull the Vaultwarden container image.
    # Default: "IfNotPresent"
    pullPolicy: ""
  # Init container image configurations.
  # Source: https://hub.docker.com/_/busybox
  init:
    # The registry where the Init container image is hosted.
    # Default: "docker.io"
    registry: ""
    # The name of the repository that contains the Init container image used.
    # Default: "busybox"
    repository: ""
    # The tag that specifies the version of the Init container image used.
    # Default: "1.36.1"
    tag: ""
    # The policy that determines when Kubernetes should pull the Init container image.
    # Default: "IfNotPresent"
    pullPolicy: ""

# Credentials used to securely authenticate and authorise the pulling of container images from private registries.
# Example:
# imagePullSecrets:
#   - name: "ghcr-token-secret"
imagePullSecrets: []

# Service account configurations for Vaultwarden pods.
serviceAccount:
  # Specifies whether a service account should be created for Vaultwarden.
  # Example:
  # create: true
  create: false
  # The name of the service account used by Vaultwarden pods.
  # Note: Required to use an existing service account when "create" is false.
  # Default: "${.Release.Name}-vaultwarden"
  # Example:
  # name: "vaultwarden"
  name: ""
  # Annotations to be applied to the created service account.
  # Example:
  # annotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/vaultwarden"
  annotations: {}

# The node labels a node must have for Vaultwarden pods to be scheduled onto it.
# Example:
# nodeSelector:
#   kubernetes.io/arch: "amd64"
nodeSelector: {}

# The tolerations that allow Vaultwarden pods to be scheduled onto tainted nodes.
# Example:
# tolerations:
#   - key: "dedicated"
#     operator: "Equal"
#     value: "passwords"
#     effect: "NoSchedule"
tolerations: []

# The scheduling constraints applied to Vaultwarden pods.
# Example:
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#         - matchExpressions:
#             - key: "kubernetes.io/arch"
#               operator: "In"
#               values:
#                 - "amd64"
affinity: {}

# Additional environment variables to be set on the Vaultwarden container.
# Note: Takes precedence over variables set through the ConfigMap and Secret.
# Example:
# extraEnv:
#   - name: "ORG_EVENTS_ENABLED"
#     value: "true"
#   - name: "SSO_CLIENT_SECRET"
#     valueFrom:
#       secretKeyRef:
#         name: "vaultwarden-sso"
#         key: "secret"
extraEnv: []

# Additional volumes to be added to Vaultwarden pods.
# Example:
# extraVolumes:
#   - name: "certs"
#     configMap:
#       name: "ca-certs"
extraVolumes: []

# Additional volume mounts to be added to the Vaultwarden container.
# Example:
# extraVolumeMounts:
#   - name: "certs"
#     mountPath: "/etc/ssl/custom"
#     readOnly: true
extraVolumeMounts: []

# Vaultwarden configurations.
vaultwarden:
  # The secret password for accessing the Vaultwarden admin panel.
  # Note: Please refer to https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token.
  # Example:
  # adminToken: "password"
  adminToken: ""
  # Number of days to retain trashed items before permanent deletion.
  # Example:
  # clearTrash: "30"
  clearTrash: ""
  # The ingress domain name that hosts the Vaultwarden server.
  # Example:
  # domain: "vaultwarden.example.com"
  domain: ""
  # Specifies whether to allow users to change their account email address.
  # Default: "true"
  # Example:
  # emailUpdate: "false"
  emailUpdate: ""
  # Specifies whether to allow enabling emergency access to user accounts.
  # Default: "true"
  # Example:
  # emergencyAccess: "false"
  emergencyAccess: ""
  # The Have I Been Pwned API key for password breach checks.
  # Note: You may acquire the API key from https://haveibeenpwned.com/API/Key.
  # Example:
  # hibpApiKey: "secret"
  hibpApiKey: ""
  # The verbosity level of the Vaultwarden logs.
  # Default: "info"
  # Example:
  # logLevel: "debug"
  logLevel: ""
  # Specifies whether to require notifying users when a new device logs into their account.
  # Default: "false"
  # Example:
  # notifyNewDevice: "true"
  notifyNewDevice: ""
  # Specifies whether to allow users to use the Bitwarden Send feature.
  # Default: "true"
  # Example:
  # send: "false"
  send: ""
  # A list of experimental client feature flags to enable certain experimental functionality.
  # Note: Please refer to https://github.com/dani-garcia/vaultwarden/blob/main/.env.template#L369 for the full list of options.
  # Example:
  # expFeatures:
  #   - "autofill-v2"
  #   - "extension-refresh"
  expFeatures: []
  # The name of an existing Secret to load sensitive environment variables from.
  # Note: Keys must be the exact environment variable names (e.g. "ADMIN_TOKEN", "DATABASE_URL", "SMTP_PASSWORD").
  # Example:
  # existingSecret: "vaultwarden-secret"
  existingSecret: ""
  # Specifies whether to hide the onboarding dialogs, extension install prompts, and premium upsell modals shown by the clients.
  # Default: "false"
  # Example:
  # suppressOnboarding: "true"
  suppressOnboarding: ""
  # The base URL of the feed that provides the Fill Assist rules to the clients.
  # Note: Must be an HTTPS URL without credentials, query parameters, or fragments.
  # Default: "https://fillassist.bitwarden.com"
  # Example:
  # fillAssistRulesUrl: "https://fillassist.example.com"
  fillAssistRulesUrl: ""
  # Specifies whether to serve the web vault.
  # Default: "true"
  # Example:
  # webVaultEnabled: "false"
  webVaultEnabled: ""
  # Custom init script to run before the Vaultwarden container starts.
  # Example:
  # initScript: >-
  #   echo "Hello, World!"
  #   echo "This is a custom init script."
  initScript: ""

# Admin panel configurations.
admin:
  # Specifies whether to bypass the security of the admin panel.
  # Note: Only use it with a separate authentication layer in front of Vaultwarden, otherwise anyone can open the admin panel.
  # Default: "false"
  # Example:
  # disableToken: "true"
  disableToken: ""
  # The number of minutes an admin session lasts for.
  # Default: "20"
  # Example:
  # sessionLifetime: "60"
  sessionLifetime: ""

# Duo two-factor authentication (2FA) configurations.
duo:
  # Specifies whether to enable Duo 2FA integration for all users.
  # Note: Users can configure Duo themselves when this is disabled.
  # Default: "false"
  # Example:
  # enabled: "true"
  enabled: ""
  # The integration key (client ID) of the Duo application.
  # Note: Please refer to https://help.bitwarden.com/article/setup-two-step-login-duo/ on how to create the Duo application.
  # Example:
  # id: "id"
  id: ""
  # The secret key (client secret) of the Duo application.
  # Example:
  # key: "secret"
  key: ""
  # The API hostname of the Duo application.
  # Example:
  # host: "api-xxxxxxxx.duosecurity.com"
  host: ""

# Icon configurations.
icons:
  # The service that provides website icons.
  # Note: Accepts "internal", "bitwarden", "duckduckgo", "google", or a URL containing "{}" for the domain.
  # Default: "internal"
  # Example:
  # service: "duckduckgo"
  service: ""
  # The HTTP status code used to redirect to an external icon service.
  # Note: Accepts 301, 302, 307, and 308, and the Bitwarden clients support 301 and 302 best.
  # Default: "302"
  # Example:
  # redirectCode: "308"
  redirectCode: ""
  # The number of seconds a downloaded icon is considered fresh.
  # Note: Set to "0" to keep icons forever.
  # Default: "2592000"
  # Example:
  # cacheTtl: "604800"
  cacheTtl: ""
  # The number of seconds before retrying an icon that was not available.
  # Note: Set to "0" to keep the result forever.
  # Default: "259200"
  # Example:
  # cacheNegativeTtl: "86400"
  cacheNegativeTtl: ""
  # The number of seconds before giving up on downloading an icon.
  # Default: "10"
  # Example:
  # downloadTimeout: "30"
  downloadTimeout: ""
  # Specifies whether to stop downloading icons and only serve the ones already cached.
  # Note: "cacheTtl" must be "0" as well, otherwise cached icons are eventually deleted and not downloaded again.
  # Default: "false"
  # Example:
  # disableDownload: "true"
  disableDownload: ""

# Invitation configurations.
invitation:
  # Specifies whether to allow organisation admins to send user invitations.
  # Default: "false"
  # Example:
  # enabled: "true"
  enabled: ""
  # The number of hours after which an invitation token expires.
  # Note: This expiry duration applies to all organisation invite, emergency access invite, email verification, and deletion request tokens.
  # Default: "120"
  # Example:
  # expiry: "48"
  expiry: ""
  # The default organisation display name shown in invitation emails.
  # Default: "Vaultwarden"
  # Example:
  # organisation: "ExampleOrg"
  organisation: ""

# Scheduled job configurations.
jobs:
  # The number of milliseconds between checks for jobs that need to run.
  # Note: Set to "0" to disable all scheduled jobs.
  # Default: "30000"
  # Example:
  # pollInterval: "60000"
  pollInterval: ""
  # The cron schedules of the scheduled jobs.
  # Note: Uses "second minute hour day-of-month month day-of-week" and "disabled" turns a job off.
  schedules:
    # The cron schedule of the job that deletes Sends past their deletion date.
    # Default: "0 5 * * * *"
    # Example:
    # sendPurge: "0 5 * * * *"
    sendPurge: ""
    # The cron schedule of the job that permanently deletes trashed items.
    # Default: "0 5 0 * * *"
    # Example:
    # trashPurge: "0 5 0 * * *"
    trashPurge: ""
    # The cron schedule of the job that checks for incomplete two-factor authentication logins.
    # Default: "30 * * * * *"
    # Example:
    # incomplete2fa: "30 * * * * *"
    incomplete2fa: ""
    # The cron schedule of the job that sends expiration reminders to emergency access grantors.
    # Default: "0 3 * * * *"
    # Example:
    # emergencyNotificationReminder: "0 3 * * * *"
    emergencyNotificationReminder: ""
    # The cron schedule of the job that grants emergency access requests that have met the required wait time.
    # Default: "0 7 * * * *"
    # Example:
    # emergencyRequestTimeout: "0 7 * * * *"
    emergencyRequestTimeout: ""
    # The cron schedule of the job that deletes old events.
    # Default: "0 10 0 * * *"
    # Example:
    # eventCleanup: "0 10 0 * * *"
    eventCleanup: ""
    # The cron schedule of the job that deletes old authentication requests.
    # Default: "30 * * * * *"
    # Example:
    # authRequestPurge: "30 * * * * *"
    authRequestPurge: ""
    # The cron schedule of the job that deletes expired Duo contexts.
    # Default: "30 * * * * *"
    # Example:
    # duoContextPurge: "30 * * * * *"
    duoContextPurge: ""
    # The cron schedule of the job that deletes leftovers of incomplete SSO logins.
    # Default: "0 20 0 * * *"
    # Example:
    # incompleteSsoPurge: "0 20 0 * * *"
    incompleteSsoPurge: ""

# Limit configurations.
limits:
  # The maximum attachment storage in kilobytes allowed per user.
  # Default: No limit
  # Example:
  # userAttachment: "102400"
  userAttachment: ""
  # The maximum attachment storage in kilobytes allowed per organization.
  # Default: No limit
  # Example:
  # organizationAttachment: "1048576"
  organizationAttachment: ""
  # The maximum Send storage in kilobytes allowed per user.
  # Default: No limit
  # Example:
  # userSend: "102400"
  userSend: ""
  # Specifies whether to raise the secure note size limit from 10,000 to 100,000 characters.
  # Note: May cause issues with clients, and exports will not work on Bitwarden servers.
  # Default: "false"
  # Example:
  # increaseNoteSize: "true"
  increaseNoteSize: ""

# Logging configurations.
logging:
  # Specifies whether to show timestamps and targets in the logs.
  # Default: "true"
  # Example:
  # extended: "false"
  extended: ""
  # The timestamp format used in extended logging.
  # Note: Accepts the format specifiers of https://docs.rs/chrono/latest/chrono/format/strftime.
  # Default: "%Y-%m-%d %H:%M:%S.%3f"
  # Example:
  # timestampFormat: "%Y-%m-%dT%H:%M:%S"
  timestampFormat: ""
  # Specifies whether to send the logs to Syslog.
  # Note: Requires extended logging.
  # Default: "false"
  # Example:
  # syslog: "true"
  syslog: ""
  # The path of a file to write the logs to.
  # Note: The path must be writable, e.g. on the data storage.
  # Example:
  # file: "/data/vaultwarden.log"
  file: ""

# Mail configurations.
mail:
  # The email address used in the "from" address for sent emails.
  # Default: "${.smtp.user}"
  # Example:
  # fromEmail: "no-reply@example.com"
  fromEmail: ""
  # The display name used in the "from" address for sent emails.
  # Default: "Vaultwarden"
  # Example:
  # fromName: "Example User"
  fromName: ""
  # SMTP server configurations.
  smtp:
    # The hostname or IP address of the SMTP server for sending emails.
    # Example:
    # host: "smtp.gmail.com"
    host: ""
    # The port number on the SMTP server used for sending emails.
    # Default: "587" for starttls, "465" for force_tls, "25" for off
    # Example:
    # port: "465"
    port: ""
    # The SMTP security protocol used for securing email communication.
    # Note: Accepts "starttls", "force_tls", or "off".
    # Default: "starttls"
    # Example:
    # security: "force_tls"
    security: ""
    # The username for authenticating with the SMTP server.
    # Example:
    # user: "vaultwarden@example.com"
    user: ""
    # The password for authenticating with the SMTP server.
    # Example:
    # password: "password"
    password: ""
    # The authentication mechanisms to use with the SMTP server, separated by commas.
    # Note: Accepts "Plain", "Login", and "Xoauth2".
    # Default: "Plain" and "Login" for encrypted connections, none otherwise
    # Example:
    # authMechanism: "Login"
    authMechanism: ""
    # The number of seconds before giving up on connecting to the SMTP server.
    # Default: "15"
    # Example:
    # timeout: "30"
    timeout: ""
    # The server name sent to the SMTP server during HELO.
    # Note: Change it if the default, the host name of the container, is rejected by anti-spam filters.
    # Example:
    # heloName: "vault.example.com"
    heloName: ""
    # Specifies whether to embed images in emails as attachments.
    # Default: "true"
    # Example:
    # embedImages: "false"
    embedImages: ""
    # Specifies whether to log detailed SMTP messages.
    # Note: The logs may contain usernames and passwords, only enable it while troubleshooting.
    # Default: "false"
    # Example:
    # debug: "true"
    debug: ""
    # Specifies whether to accept invalid TLS certificates of the SMTP server.
    # Note: Exposes emails to man-in-the-middle attacks, use only as a last resort.
    # Default: "false"
    # Example:
    # acceptInvalidCerts: "true"
    acceptInvalidCerts: ""
    # Specifies whether to accept TLS certificates of the SMTP server that do not match its host name.
    # Note: Exposes emails to man-in-the-middle attacks, use only as a last resort.
    # Default: "false"
    # Example:
    # acceptInvalidHostnames: "true"
    acceptInvalidHostnames: ""
  # Sendmail configurations.
  sendmail:
    # Specifies whether to send emails with the "sendmail" command.
    # Note: Requires the command to exist in the image, which the default image may not provide.
    # Default: "false"
    # Example:
    # enabled: "true"
    enabled: ""
    # The path of the "sendmail" command.
    # Default: "sendmail" from the PATH
    # Example:
    # command: "/usr/sbin/sendmail"
    command: ""

# Network configurations.
network:
  # The port on which Vaultwarden listens inside the container.
  # Note: Use a port above 1023 when running as a non-root user.
  # Default: "80"
  # Example:
  # port: "8080"
  port: ""
  # The address Vaultwarden binds to inside the container.
  # Default: "0.0.0.0"
  # Example:
  # address: "::"
  address: ""
  # The request header that carries the IP address of the client.
  # Note: Set to "none" to use the address of the connection.
  # Default: "X-Real-IP"
  # Example:
  # ipHeader: "X-Forwarded-For"
  ipHeader: ""
  # The addresses the client IP header is accepted from.
  # Note: Accepts "local", "all", or a comma-separated list of IP addresses and CIDR ranges.
  # Default: "local"
  # Example:
  # ipHeaderTrustedProxies: "10.42.0.0/16"
  ipHeaderTrustedProxies: ""
  # Specifies whether to enable websocket notifications.
  # Default: "true"
  # Example:
  # websocket: "false"
  websocket: ""
  # Specifies whether to resolve IPv6 addresses first and fall back to IPv4.
  # Note: Useful in IPv6-only environments.
  # Default: "false"
  # Example:
  # dnsPreferIpv6: "true"
  dnsPreferIpv6: ""
  # The domains allowed to embed the web vault in an iframe.
  # Note: Only enable it if embedding is needed, since it relaxes the frame-ancestors security header.
  # Example:
  # allowedIframeAncestors:
  #   - "https://intranet.example.com"
  allowedIframeAncestors: []
  # The additional HTTPS domains that scripts in the web vault may connect to (e.g. email alias services).
  # Example:
  # allowedConnectSrc:
  #   - "https://addy.example.com"
  allowedConnectSrc: []

# Organization configurations.
organization:
  # The users allowed to create organizations.
  # Note: Accepts a list of email addresses, or "none" for nobody.
  # Default: All users
  # Example:
  # creationUsers:
  #   - "admin@example.com"
  creationUsers: []
  # Specifies whether to log events of organizations.
  # Note: Combine it with "eventsRetainDays" to clean up old events.
  # Default: "false"
  # Example:
  # eventsEnabled: "true"
  eventsEnabled: ""
  # The number of days events are kept in the database.
  # Default: Events are kept indefinitely
  # Example:
  # eventsRetainDays: "90"
  eventsRetainDays: ""
  # Specifies whether to enable groups for organizations.
  # Note: A beta feature with known issues.
  # Default: "false"
  # Example:
  # groupsEnabled: "true"
  groupsEnabled: ""
  # Specifies whether the Single Org policy must be enabled before the Reset Password policy.
  # Default: "false"
  # Example:
  # enforceSingleOrgWithResetPasswordPolicy: "true"
  enforceSingleOrgWithResetPasswordPolicy: ""

# Outbound request configurations for the internal HTTP client.
outbound:
  # Specifies whether to refuse connecting to non-global IP addresses.
  # Note: Protects hosts on the internal network.
  # Default: "true"
  # Example:
  # blockNonGlobalIps: "false"
  blockNonGlobalIps: ""
  # A regular expression matching the domains and IP addresses that must not be fetched.
  # Example:
  # blockRegex: "^(192\\.168\\.1\\.[0-9]+)$"
  blockRegex: ""

# Password configurations.
password:
  # The number of server-side hashing iterations for the password hash of new users.
  # Note: Existing users are updated on their next login, and the value must be at least 100000.
  # Default: "600000"
  # Example:
  # iterations: "800000"
  iterations: ""
  # Specifies whether users can set and view password hints.
  # Default: "true"
  # Example:
  # hintsAllowed: "false"
  hintsAllowed: ""
  # Specifies whether a password hint is shown in the web page when email is not configured and hints are allowed.
  # Note: Gives unauthenticated access to hints, so not recommended for publicly accessible instances.
  # Default: "false"
  # Example:
  # showHint: "true"
  showHint: ""

# Bitwarden Push Relay configurations.
push:
  # Specifies whether to enable automatic vault sync in all clients using push notifications.
  # Default: "false"
  # Example:
  # enabled: "true"
  enabled: ""
  # The private installation ID for self-hosting or unlocking certain Bitwarden features.
  # Note: Please refer to https://github.com/dani-garcia/vaultwarden/wiki/Enabling-Mobile-Client-push-notification on how to acquire the installation ID.
  # Example:
  # id: "id"
  id: ""
  # The private installation key for self-hosting or unlocking certain Bitwarden features.
  # Note: Please refer to https://github.com/dani-garcia/vaultwarden/wiki/Enabling-Mobile-Client-push-notification on how to acquire the installation key.
  # Example:
  # key: "secret"
  key: ""
  # The URI of the Bitwarden push relay.
  # Note: Use "https://api.bitwarden.eu" for the European Union data region, and only change it if the implications are understood.
  # Default: "https://push.bitwarden.com"
  # Example:
  # relayUri: "https://api.bitwarden.eu"
  relayUri: ""
  # The URI of the Bitwarden push identity server.
  # Note: Use "https://identity.bitwarden.eu" for the European Union data region, and only change it if the implications are understood.
  # Default: "https://identity.bitwarden.com"
  # Example:
  # identityUri: "https://identity.bitwarden.eu"
  identityUri: ""

# Rate limit configurations.
rateLimit:
  # Rate limits of login and two-factor authentication requests from the same IP address.
  login:
    # The average number of seconds between requests before rate limiting starts.
    # Default: "60"
    # Example:
    # seconds: "30"
    seconds: ""
    # The size of the burst of requests allowed on top of the average.
    # Note: Applies to both login and two-factor authentication, so keep it at 2 or more.
    # Default: "10"
    # Example:
    # maxBurst: "20"
    maxBurst: ""
  # Rate limits of unauthenticated requests (e.g. password hints, account recovery, and Sends) from the same IP address.
  unauthenticated:
    # The average number of seconds between requests before rate limiting starts.
    # Default: "60"
    # Example:
    # seconds: "30"
    seconds: ""
    # The size of the burst of requests allowed on top of the average.
    # Default: "50"
    # Example:
    # maxBurst: "100"
    maxBurst: ""
  # Rate limits of admin panel login requests from the same IP address.
  admin:
    # The average number of seconds between requests before rate limiting starts.
    # Default: "300"
    # Example:
    # seconds: "600"
    seconds: ""
    # The size of the burst of requests allowed on top of the average.
    # Default: "3"
    # Example:
    # maxBurst: "5"
    maxBurst: ""

# Account registration configurations.
signup:
  # Specifies whether to open up the Vaultwarden instance to new user account registrations.
  # Default: "false"
  # Example:
  # enabled: "true"
  enabled: ""
  # Specifies whether to require email verification for new user registrations.
  # Default: "false"
  # Example:
  # verification: "true"
  verification: ""
  # The number of seconds before a verification email can be resent.
  # Default: "3600"
  # Example:
  # resendInterval: "1800"
  resendInterval: ""
  # The maximum number of times a verification email can be resent.
  # Default: "6"
  # Example:
  # resendLimit: "3"
  resendLimit: ""
  # A list of domains allowed for user account registration.
  # Note: This setting is applied regardless if the Vaultwarden instance is set to accept user registrations.
  # Example:
  # domainWhitelist:
  #   - "example.com"
  #   - "example.org"
  domainWhitelist: []

# Single sign-on (SSO) configurations using OpenID Connect (OIDC).
sso:
  # Specifies whether users can log in through an OIDC provider.
  # Note: Requires "authority", "clientId", and "clientSecret", and the redirect URI of the provider client must be "https://${.vaultwarden.domain}/identity/connect/oidc-signin".
  # Default: "false"
  # Example:
  # enabled: "true"
  enabled: ""
  # Specifies whether to prevent users from logging in with their email and master password.
  # Note: Keep this off until signing in with SSO is confirmed to work, otherwise nobody can log in.
  # Default: "false"
  # Example:
  # only: "true"
  only: ""
  # Specifies whether the SSO login flow can create new accounts.
  # Note: Consider turning this off when using a public provider.
  # Default: "true"
  # Example:
  # signupsAllowed: "false"
  signupsAllowed: ""
  # Specifies whether a new SSO user is linked to an existing account with the same email address.
  # Default: "true"
  # Example:
  # signupsMatchEmail: "false"
  signupsMatchEmail: ""
  # Specifies whether to accept users whose email verification status is unknown to the provider.
  # Note: Allowing this together with "signupsMatchEmail" opens a potential account takeover.
  # Default: "false"
  # Example:
  # allowUnknownEmailVerification: "true"
  allowUnknownEmailVerification: ""
  # The base URL of the OIDC provider.
  # Note: Must not end with a slash or include the "/.well-known/openid-configuration" path.
  # Example:
  # authority: "https://id.example.com"
  authority: ""
  # The client ID of the application registered with the OIDC provider.
  # Example:
  # clientId: "vaultwarden"
  clientId: ""
  # The client secret of the application registered with the OIDC provider.
  # Example:
  # clientSecret: "secret"
  clientSecret: ""
  # The space-separated scopes requested from the OIDC provider.
  # Note: The "openid" scope is always requested.
  # Default: "email profile"
  # Example:
  # scopes: "email profile groups"
  scopes: ""
  # The additional parameters added to the authorization request.
  # Example:
  # authorizeExtraParams: "access_type=offline&prompt=consent"
  authorizeExtraParams: ""
  # Specifies whether to use PKCE for the authorization code flow.
  # Default: "true"
  # Example:
  # pkce: "false"
  pkce: ""
  # A regular expression matching additional audiences trusted in the ID token.
  # Note: Only the client ID is trusted by default.
  # Example:
  # audienceTrusted: "^other-client$"
  audienceTrusted: ""
  # The master password policy applied to users signing in with SSO.
  # Note: Accepts "enforceOnLogin", "minComplexity" (0 to 4), "minLength", "requireLower", "requireNumbers", "requireSpecial", and "requireUpper".
  # Example:
  # masterPasswordPolicy:
  #   enforceOnLogin: false
  #   minComplexity: 3
  #   minLength: 12
  masterPasswordPolicy: {}
  # Specifies whether to use SSO only for authentication and keep the default Vaultwarden session lifecycle.
  # Default: "false"
  # Example:
  # authOnlyNotSession: "true"
  authOnlyNotSession: ""
  # The number of seconds the OIDC discovery document is cached for.
  # Note: Set to "0" to disable caching.
  # Default: "0"
  # Example:
  # clientCacheExpiration: "300"
  clientCacheExpiration: ""
  # Specifies whether to log all tokens.
  # Note: Requires the log level to be "debug".
  # Default: "false"
  # Example:
  # debugTokens: "true"
  debugTokens: ""

# Two-factor authentication (2FA) configurations.
tfa:
  # Specifies whether to allow small time discrepancies for TOTP code validation.
  # Default: "true"
  # Example:
  # allowTimeDrift: "false"
  allowTimeDrift: ""
  # The number of minutes before a pending 2FA-enabled login is considered incomplete.
  # Default: "3"
  # Example:
  # expiry: "0"
  expiry: ""
  # Specifies whether to allow users to remember their device for 2FA sessions.
  # Default: "true"
  # Example:
  # rememberDevice: "false"
  rememberDevice: ""
  # The number of days before a remembered 2FA login expires.
  # Note: Accepts 1 to 90.
  # Default: "30"
  # Example:
  # rememberDays: "14"
  rememberDays: ""
  # Specifies whether to setup email 2FA upon registration.
  # Default: "false"
  # Example:
  # emailEnforce: "true"
  emailEnforce: ""
  # The number of seconds after which a 2FA email token expires.
  # Default: "600"
  # Example:
  # emailExpiry: "300"
  emailExpiry: ""
  # Specifies whether to automatically use email as a fallback 2FA method.
  # Default: "false"
  # Example:
  # emailFallback: "true"
  emailFallback: ""
  # The maximum number of attempts after which the 2FA email token is reset.
  # Default: "3"
  # Example:
  # emailLimit: "2"
  emailLimit: ""
  # The length of the secret 2FA email token.
  # Note: Bitwarden clients are hardcoded to mention 6 digit codes regardless of this setting.
  # Default: "6"
  # Example:
  # emailTokenSize: "255"
  emailTokenSize: ""

# Yubico (YubiKey) configurations.
yubico:
  # Specifies whether to enable Yubico 2FA integration.
  # Default: "false"
  # Example:
  # enabled: "true"
  enabled: ""
  # The API client ID for enabling YubiKey OTP authentication.
  # Note: Please refer to https://github.com/dani-garcia/vaultwarden/wiki/Enabling-Yubikey-OTP-authentication on how to acquire the client ID.
  # Example:
  # id: "id"
  id: ""
  # The API secret key for enabling YubiKey OTP authentication.
  # Note: Please refer to https://github.com/dani-garcia/vaultwarden/wiki/Enabling-Yubikey-OTP-authentication on how to acquire the secret key.
  # Example:
  # key: "secret"
  key: ""
  # The URL of the Yubico API server for 2FA verification.
  # Example:
  # server: "http://yubico.example.com/wsapi/2.0/verify"
  server: ""

# Database configurations.
db:
  # The database engine or backend being used by Vaultwarden.
  # Note: Accepts "sqlite", "mysql", or "postgresql".
  # Default: "sqlite"
  # Example:
  # type: "mysql"
  type: ""
  # The hostname or IP address of the Vaultwarden database server.
  # Example:
  # host: "vaultwarden.default.svc.cluster.local"
  host: ""
  # The port number the Vaultwarden database server is listening for connections.
  # Note: Only applies when db.type is "mysql" or "postgresql".
  # Default: "5432" for postgresql, "3306" for mysql
  # Example:
  # port: "5433"
  port: ""
  # The name of the database being used by Vaultwarden.
  # Example:
  # name: "vaultwarden"
  name: ""
  # The username or user account for accessing the Vaultwarden database.
  # Example:
  # user: "root"
  user: ""
  # The password associated with the Vaultwarden database user.
  # Example:
  # password: "password"
  password: ""
  # Specifies whether Vaultwarden enables write-ahead logging (WAL) on the SQLite database at startup.
  # Note: Only applies when db.type is "sqlite". Turning it off may cause worse performance.
  # Default: "true"
  # Example:
  # wal: "false"
  wal: ""
  # The number of times to retry the database connection at startup.
  # Note: Set to "0" to retry indefinitely.
  # Default: "15"
  # Example:
  # connectionRetries: "30"
  connectionRetries: ""
  # The number of seconds to wait when acquiring a database connection.
  # Default: "30"
  # Example:
  # timeout: "60"
  timeout: ""
  # The number of seconds before an idle database connection is closed.
  # Default: "600"
  # Example:
  # idleTimeout: "300"
  idleTimeout: ""
  # The maximum size of the database connection pool.
  # Default: "10"
  # Example:
  # maxConnections: "20"
  maxConnections: ""
  # The minimum size of the database connection pool.
  # Default: "2"
  # Example:
  # minConnections: "1"
  minConnections: ""
  # The SQL statements to run whenever a new database connection is created.
  # Default: "PRAGMA busy_timeout = 5000; PRAGMA synchronous = NORMAL;" for sqlite, none otherwise
  # Example:
  # connectionInit: "PRAGMA busy_timeout = 10000;"
  connectionInit: ""

# Ingress configurations.
ingress:
  # Specifies whether Ingress should be enabled for hosting Vaultwarden services.
  # Example:
  # enabled: true
  enabled: false
  # The class of the ingress controller that handles the Ingress.
  # Default: "nginx"
  # Example:
  # className: "traefik"
  className: ""
  # The name of the cluster issuer for Ingress.
  # Default: "letsencrypt-dns-prod"
  # Example:
  # clusterIssuer: "letsencrypt-http-prod"
  clusterIssuer: ""
  # Specifies whether the WWW subdomain should be enabled.
  # Example:
  # www: true
  www: false
  # The name of the Secret that stores the TLS certificate of the Ingress.
  # Default: "${.Release.Name}-vaultwarden-tls-cert"
  # Example:
  # tlsSecretName: "vaultwarden-tls"
  tlsSecretName: ""
  # Additional configuration annotations to be added to the Ingress resource.
  # Items: `.prefix`, `.name`, `.value`
  # Example:
  # customAnnotations:
  #   # The prefix of the annotation.
  #   # Default: "nginx.ingress.kubernetes.io"
  #   # Example:
  #   # prefix: "nginx.org"
  #   - prefix: ""
  #   # The name of the annotation.
  #   # Example:
  #   # name: "proxy-connect-timeout"
  #     name: ""
  #   # The value of the annotation.
  #   # Example:
  #   # value: "120"
  #     value: ""
  customAnnotations: []

# Service configurations.
service:
  # The optional node port to expose when the service type is NodePort.
  # Example:
  # nodePort: "32000"
  nodePort: ""
  # The port on which the Vaultwarden server should listen for connections.
  # Default: "80"
  # Example:
  # port: "8080"
  port: ""
  # The type of service used to expose Vaultwarden services.
  # Default: "ClusterIP"
  # Example:
  # type: "NodePort"
  type: ""

# Storage configurations.
storage:
  # Data storage configurations.
  data:
    # Specifies whether persistent storage should be provisioned for data storage.
    # Example:
    # enabled: true
    enabled: false
    # The access mode defining how the data storage can be mounted.
    # Default: "ReadWriteOnce"
    # Example:
    # accessMode: "ReadWriteMany"
    accessMode: ""
    # The path where the data storage should be mounted on the container.
    # Default: "/data"
    # Example:
    # mountPath: "/config"
    mountPath: ""
    # The subpath within the data storage to mount to the container. Leave empty if not required.
    # Example:
    # subPath: "Data"
    subPath: ""
    # The default amount of persistent storage allocated for the data storage.
    # Default: "1Gi"
    # Example:
    # storage: "10Gi"
    storage: ""
    # The storage class name used for dynamically provisioning a persistent volume for the data storage.
    # Default: "longhorn"
    # Example:
    # storageClassName: "smb"
    storageClassName: ""

# Container health probes for Vaultwarden.
probes:
  # Vaultwarden container health probes.
  vaultwarden:
    # Startup probe to check if the Vaultwarden container has started successfully.
    startup:
      # Specifies whether to enable the startup probe for the Vaultwarden container.
      # Example:
      # enabled: true
      enabled: false
      # The specification defining how the startup probe checks the Vaultwarden container health.
      # Example:
      # spec:
      #   httpGet:
      #     path: /alive
      #     port: vaultwarden
      #   initialDelaySeconds: 5
      #   periodSeconds: 5
      #   timeoutSeconds: 5
      #   failureThreshold: 30
      #   successThreshold: 1
      spec: {}
    # Liveness probe to check if the Vaultwarden container is running properly.
    liveness:
      # Specifies whether to enable the liveness probe for the Vaultwarden container.
      # Example:
      # enabled: true
      enabled: false
      # The specification defining how the liveness probe checks the Vaultwarden container health.
      # Note: A default probe configuration will be used if not set for the container.
      # Example:
      # spec:
      #   httpGet:
      #     path: /alive
      #     port: vaultwarden
      #   initialDelaySeconds: 10
      #   periodSeconds: 10
      #   timeoutSeconds: 5
      #   failureThreshold: 3
      #   successThreshold: 1
      spec: {}
    # Readiness probe to check if the Vaultwarden container is ready to serve requests.
    readiness:
      # Specifies whether to enable the readiness probe for the Vaultwarden container.
      # Example:
      # enabled: true
      enabled: false
      # The specification defining how the readiness probe checks the Vaultwarden container health.
      # Note: A default probe configuration will be used if not set for the container.
      # Example:
      # spec:
      #   httpGet:
      #     path: /alive
      #     port: vaultwarden
      #   initialDelaySeconds: 10
      #   periodSeconds: 5
      #   timeoutSeconds: 5
      #   failureThreshold: 6
      #   successThreshold: 1
      spec: {}

# Resource requirements and limits for Vaultwarden containers.
resources:
  # Vaultwarden container resources.
  # Example:
  # vaultwarden:
  #   # The minimum amount of resources required by Vaultwarden to run.
  #   requests:
  #     # The minimum amount of CPU resources required by Vaultwarden.
  #     # Example:
  #     # cpu: "10m"
  #     cpu: "50m"
  #     # The minimum amount of memory required by Vaultwarden.
  #     # Example:
  #     # memory: "10Mi"
  #     memory: "150Mi"
  #   # The maximum amount of resources allowed for Vaultwarden.
  #   limits:
  #     # The maximum amount of CPU resources allowed for Vaultwarden.
  #     # Example:
  #     # cpu: "250m"
  #     cpu: "100m"
  #     # The maximum amount of memory allowed for Vaultwarden.
  #     # Example:
  #     # memory: "250Mi"
  #     memory: "250Mi"
  vaultwarden: {}
