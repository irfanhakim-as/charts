{{- if eq (include "pocket-id.secretEnabled" .) "true" }}
{{- $encryptionKey := include "pocket-id.encryptionKey" . }}
{{- $staticApiKey := include "pocket-id.staticApiKey" . }}
{{- $ldapBindDn := include "pocket-id.ldapBindDn" . }}
{{- $ldapBindPassword := include "pocket-id.ldapBindPassword" . }}
{{- $maxmindLicenseKey := include "pocket-id.maxmindLicenseKey" . }}
{{- $smtpUser := include "pocket-id.smtpUser" . }}
{{- $smtpPassword := include "pocket-id.smtpPassword" . }}
{{- $s3AccessKeyId := include "pocket-id.s3AccessKeyId" . }}
{{- $s3SecretAccessKey := include "pocket-id.s3SecretAccessKey" . }}
{{- $tlsKey := include "pocket-id.tlsKey" . }}
{{- $dbUrl := include "pocket-id.dbUrl" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pocket-id-secret
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
type: Opaque
data:
{{- if $encryptionKey }}
  ENCRYPTION_KEY: {{ $encryptionKey | b64enc }}
{{- end }}
{{- if $staticApiKey }}
  STATIC_API_KEY: {{ $staticApiKey | b64enc }}
{{- end }}
{{- if $ldapBindDn }}
  LDAP_BIND_DN: {{ $ldapBindDn | b64enc }}
{{- end }}
{{- if $ldapBindPassword }}
  LDAP_BIND_PASSWORD: {{ $ldapBindPassword | b64enc }}
{{- end }}
{{- if $maxmindLicenseKey }}
  MAXMIND_LICENSE_KEY: {{ $maxmindLicenseKey | b64enc }}
{{- end }}
{{- if $smtpUser }}
  SMTP_USER: {{ $smtpUser | b64enc }}
{{- end }}
{{- if $smtpPassword }}
  SMTP_PASSWORD: {{ $smtpPassword | b64enc }}
{{- end }}
{{- if $s3AccessKeyId }}
  S3_ACCESS_KEY_ID: {{ $s3AccessKeyId | b64enc }}
{{- end }}
{{- if $s3SecretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ $s3SecretAccessKey | b64enc }}
{{- end }}
{{- if $tlsKey }}
  TLS_KEY: {{ $tlsKey | b64enc }}
{{- end }}
{{- if $dbUrl }}
  DB_CONNECTION_STRING: {{ $dbUrl | b64enc }}
{{- end }}
{{- end }}
