{{- $domain := include "pocket-id.httpRouteDomain" . }}
{{- $gatewayName := include "pocket-id.httpRouteGatewayName" . }}
{{- $gatewayNamespace := include "pocket-id.httpRouteGatewayNamespace" . }}
{{- $port := include "pocket-id.servicePort" . }}
{{- if $domain }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-pocket-id-httproute
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gatewayName | quote }}
      namespace: {{ $gatewayNamespace | quote }}
  hostnames:
    - {{ $domain | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-pocket-id-svc
          port: {{ int $port }}
{{- end }}
