{{- $domain := include "pocket-id.httpRouteDomain" . }}
{{- $spec := include "pocket-id.httpRouteSecurityPolicy" . }}
{{- if and $domain $spec }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}-pocket-id-securitypolicy
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-pocket-id-httproute
  {{- $spec | nindent 2 }}
{{- end }}
