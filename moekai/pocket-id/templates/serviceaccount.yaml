{{- if eq (include "pocket-id.serviceAccountCreate" .) "true" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pocket-id.serviceAccountName" . }}
  labels:
    {{- include "pocket-id.labels" . | nindent 4 }}
  {{- with include "pocket-id.serviceAccountAnnotations" . }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
