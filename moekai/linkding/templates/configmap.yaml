{{- $disableBackgroundTasks := include "linkding.disableBackgroundTasks" . | quote }}
{{- $disableUrlValidation := include "linkding.disableUrlValidation" . | quote }}
{{- $csrfTrustedOrigins := include "linkding.csrfTrustedOrigins" . | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-linkding-cm
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
data:
  LD_DISABLE_BACKGROUND_TASKS: {{ $disableBackgroundTasks }}
  LD_DISABLE_URL_VALIDATION: {{ $disableUrlValidation }}
  LD_CSRF_TRUSTED_ORIGINS: {{ $csrfTrustedOrigins }}
