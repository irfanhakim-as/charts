{{- $adminUser := include "linkding.adminUser" . | b64enc }}
{{- $adminPassword := include "linkding.adminPassword" . | b64enc }}
{{- $dbType := include "linkding.dbType" . }}
{{- $dbName := include "linkding.dbName" . | b64enc }}
{{- $dbUser := include "linkding.dbUser" . | b64enc }}
{{- $dbPassword := include "linkding.dbPassword" . | b64enc }}
{{- $dbHost := include "linkding.dbHost" . | b64enc }}
{{- $dbPort := include "linkding.dbPort" . | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-linkding-secret
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
type: Opaque
data:
  LD_SUPERUSER_NAME: {{ $adminUser }}
  LD_SUPERUSER_PASSWORD: {{ $adminPassword }}
  LD_DB_ENGINE: {{ $dbType | b64enc }}
{{- if eq $dbType "postgres" }}
  LD_DB_DATABASE: {{ $dbName }}
  LD_DB_USER: {{ $dbUser }}
  LD_DB_PASSWORD: {{ $dbPassword }}
  LD_DB_HOST: {{ $dbHost }}
  LD_DB_PORT: {{ $dbPort }}
{{- end }}
