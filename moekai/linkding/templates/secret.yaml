{{- if eq (include "linkding.secretEnabled" .) "true" }}
{{- $adminUser := include "linkding.adminUser" . }}
{{- $adminPassword := include "linkding.adminPassword" . }}
{{- $postgres := eq (include "linkding.dbType" .) "postgres" }}
{{- $dbUser := include "linkding.dbUser" . }}
{{- $dbPassword := include "linkding.dbPassword" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-linkding-secret
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
type: Opaque
data:
{{- if $adminUser }}
  LD_SUPERUSER_NAME: {{ $adminUser | b64enc }}
{{- end }}
{{- if $adminPassword }}
  LD_SUPERUSER_PASSWORD: {{ $adminPassword | b64enc }}
{{- end }}
{{- if and $postgres $dbUser }}
  LD_DB_USER: {{ $dbUser | b64enc }}
{{- end }}
{{- if and $postgres $dbPassword }}
  LD_DB_PASSWORD: {{ $dbPassword | b64enc }}
{{- end }}
{{- end }}
