{{- $domain := include "linkding.ingressDomain" . }}
{{- $ingressClassName := include "linkding.ingressClassName" . }}
{{- $tlsSecretName := include "linkding.tlsSecretName" . }}
{{- $www := eq (include "linkding.ingressWww" .) "true" }}
{{- $wwwDomain := printf "www.%s" $domain | quote }}
{{- if $domain }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-linkding-ingress
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
  annotations:
    {{- include "linkding.ingressAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ $ingressClassName | quote }}
  rules:
    - host: {{ $domain | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.Name }}-linkding-svc
                port:
                  name: linkding
            path: /
            pathType: Prefix
  {{- if $www }}
    - host: {{ $wwwDomain }}
      http:
        paths:
          - backend:
              service:
                name: {{ .Release.Name }}-linkding-svc
                port:
                  name: linkding
            path: /
            pathType: Prefix
  {{- end }}
  tls:
    - hosts:
        - {{ $domain | quote }}
      {{- if $www }}
        - {{ $wwwDomain }}
      {{- end }}
      secretName: {{ $tlsSecretName | quote }}
{{- end }}
