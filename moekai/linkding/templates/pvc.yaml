{{- $dataPersistence := eq (include "linkding.dataPersistence" .) "true" }}
{{- $dataAccessMode := include "linkding.dataAccessMode" . | quote }}
{{- $dataStorage := include "linkding.dataStorage" . | quote }}
{{- $dataStorageClassName := include "linkding.dataStorageClassName" . | quote }}
{{- if $dataPersistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-linkding-data-pvc
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ $dataAccessMode }}
  resources:
    requests:
      storage: {{ $dataStorage }}
  storageClassName: {{ $dataStorageClassName }}
{{- end }}
