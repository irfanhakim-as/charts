{{- if eq (include "linkding.serviceAccountCreate" .) "true" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "linkding.serviceAccountName" . }}
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
  {{- with include "linkding.serviceAccountAnnotations" . }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
