{{- $nodePort := include "linkding.serviceNodePort" . }}
{{- $port := include "linkding.servicePort" . }}
{{- $type := include "linkding.serviceType" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-linkding-svc
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
spec:
  type: {{ $type }}
  ports:
    - port: {{ int $port }}
      targetPort: linkding
      {{- if $nodePort }}
      nodePort: {{ int $nodePort }}
      {{- end }}
      protocol: TCP
      name: linkding
  selector:
    {{- include "linkding.selectorLabels" . | nindent 4 }}
