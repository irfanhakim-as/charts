{{- $linkdingRegistry := include "linkding.imageRegistry" . }}
{{- $linkdingRepository := include "linkding.imageRepository" . }}
{{- $linkdingTag := include "linkding.imageTag" . }}
{{- $linkdingPullPolicy := include "linkding.imagePullPolicy" . | quote }}
{{- $initRegistry := include "linkding.initImageRegistry" . }}
{{- $initRepository := include "linkding.initImageRepository" . }}
{{- $initTag := include "linkding.initImageTag" . }}
{{- $initPullPolicy := include "linkding.initImagePullPolicy" . | quote }}
{{- $replicaCount := include "linkding.replicaCount" . }}
{{- $initScript := include "linkding.initScript" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-linkding
  labels:
    {{- include "linkding.labels" . | nindent 4 }}
spec:
  replicas: {{ int $replicaCount }}
  selector:
    matchLabels:
      {{- include "linkding.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with include "linkding.podAnnotations" . }}
      {{- . | nindent 6 }}
      {{- end }}
      labels:
        {{- include "linkding.selectorLabels" . | nindent 8 }}
    spec:
      {{- with include "linkding.imagePullSecrets" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- if $initScript }}
      initContainers:
        - name: init
          image: {{ printf "%s/%s:%s" $initRegistry $initRepository $initTag | quote }}
          imagePullPolicy: {{ $initPullPolicy }}
          command: ["/bin/sh"]
          args:
            - -c
            - |
              {{- $initScript | nindent 14 }}
          {{- with include "linkding.volumeMounts" . }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- end }}
      containers:
        - name: linkding
          image: {{ printf "%s/%s:%s" $linkdingRegistry $linkdingRepository $linkdingTag | quote }}
          imagePullPolicy: {{ $linkdingPullPolicy }}
          ports:
            - name: linkding
              containerPort: 9090
              protocol: TCP
          {{- include "linkding.resources" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-linkding-cm
            - secretRef:
                name: {{ .Release.Name }}-linkding-secret
          {{- with include "linkding.volumeMounts" . }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- with include "linkding.volumes" . }}
      {{- . | nindent 6 }}
      {{- end }}
