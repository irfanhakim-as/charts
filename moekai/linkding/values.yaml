# Default values for linkding.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The desired number of running replicas for Linkding.
# Default: "1"
replicaCount: ""

# The update strategy used to replace existing pods with new ones.
# Note: Set "type" to "Recreate" if data storage is enabled and mounted as "ReadWriteOnce".
# Example:
# updateStrategy:
#   type: "Recreate"
updateStrategy: {}

# Annotations to be applied to Linkding pods.
# Example:
# podAnnotations:
#   reloader.stakater.com/auto: "true"
podAnnotations: {}

# Security context applied at the pod level for Linkding.
# Note: Set fsGroup for the data storage to be writable when the container is forced to run as a non-root user.
# Example:
# podSecurityContext:
#   fsGroup: 33
podSecurityContext: {}

# Security context applied at the Linkding container level.
# Note: The image starts as root to prepare the data directory then drops to the "www-data" user, so avoid "runAsNonRoot" and "runAsUser".
# Example:
# containerSecurityContext:
#   allowPrivilegeEscalation: false
containerSecurityContext: {}

# Container images used for Linkding.
image:
  # Linkding container image configurations.
  # Source: https://hub.docker.com/r/sissbruecker/linkding
  linkding:
    # The registry where the Linkding container image is hosted.
    # Default: "docker.io"
    registry: ""
    # The name of the repository that contains the Linkding container image used.
    # Default: "sissbruecker/linkding"
    repository: ""
    # The tag that specifies the version of the Linkding container image used.
    # Default: Chart appVersion
    tag: ""
    # The policy that determines when Kubernetes should pull the Linkding container image.
    # Default: "IfNotPresent"
    pullPolicy: ""
  # Init container image configurations.
  # Source: https://hub.docker.com/_/busybox
  init:
    # The registry where the Init container image is hosted.
    # Default: "docker.io"
    registry: ""
    # The name of the repository that contains the Init container image used.
    # Default: "busybox"
    repository: ""
    # The tag that specifies the version of the Init container image used.
    # Default: "1.36.1"
    tag: ""
    # The policy that determines when Kubernetes should pull the Init container image.
    # Default: "IfNotPresent"
    pullPolicy: ""

# Credentials used to securely authenticate and authorise the pulling of container images from private registries.
# Example:
# imagePullSecrets:
#   - name: "ghcr-token-secret"
imagePullSecrets: []

# Service account configurations for Linkding pods.
serviceAccount:
  # Specifies whether a service account should be created for Linkding.
  # Example:
  # create: true
  create: false
  # The name of the service account used by Linkding pods.
  # Note: Required to use an existing service account when "create" is false.
  # Default: "${.Release.Name}-linkding"
  # Example:
  # name: "linkding"
  name: ""
  # Annotations to be applied to the created service account.
  # Example:
  # annotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/linkding"
  annotations: {}

# The node labels a node must have for Linkding pods to be scheduled onto it.
# Example:
# nodeSelector:
#   kubernetes.io/arch: "amd64"
nodeSelector: {}

# The tolerations that allow Linkding pods to be scheduled onto tainted nodes.
# Example:
# tolerations:
#   - key: "dedicated"
#     operator: "Equal"
#     value: "bookmarks"
#     effect: "NoSchedule"
tolerations: []

# The scheduling constraints applied to Linkding pods.
# Example:
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#         - matchExpressions:
#             - key: "kubernetes.io/arch"
#               operator: "In"
#               values:
#                 - "amd64"
affinity: {}

# Additional environment variables to be set on the Linkding container.
# Note: Takes precedence over variables set through the ConfigMap and Secret.
# Example:
# extraEnv:
#   - name: "LD_LOG_X_FORWARDED_FOR"
#     value: "true"
#   - name: "OIDC_RP_CLIENT_SECRET"
#     valueFrom:
#       secretKeyRef:
#         name: "linkding-oidc"
#         key: "secret"
extraEnv: []

# Additional volumes to be added to Linkding pods.
# Example:
# extraVolumes:
#   - name: "certs"
#     configMap:
#       name: "ca-certs"
extraVolumes: []

# Additional volume mounts to be added to the Linkding container.
# Example:
# extraVolumeMounts:
#   - name: "certs"
#     mountPath: "/etc/ssl/custom"
#     readOnly: true
extraVolumeMounts: []

# Linkding configurations.
linkding:
  # Specifies whether to disable background tasks and task scheduling.
  # Default: "false"
  # Example:
  # disableBackgroundTasks: "true"
  disableBackgroundTasks: ""
  # Specifies whether to disable URL validation for added bookmarks.
  # Default: "false"
  # Example:
  # disableUrlValidation: "true"
  disableUrlValidation: ""
  # The ingress domain name that hosts the Linkding server.
  # Example:
  # domain: "linkding.example.com"
  domain: ""
  # A list of trusted origins that will be accepted during CSRF verification even if their headers do not match.
  # Example:
  # csrfTrustedOrigins:
  #   - "https://linkding.example.com"
  #   - "https://www.linkding.example.com"
  csrfTrustedOrigins: []
  # The name of an existing Secret to load sensitive environment variables from.
  # Note: Keys must be the exact environment variable names (e.g. "LD_SUPERUSER_PASSWORD", "LD_DB_PASSWORD").
  # Example:
  # existingSecret: "linkding-secret"
  existingSecret: ""
  # Custom init script to run before the Linkding container starts.
  # Example:
  # initScript: >-
  #   echo "Hello, World!"
  #   echo "This is a custom init script."
  initScript: ""
  # Administration configurations.
  admin:
    # The username of the initial admin user for accessing the Linkding portal.
    # Note: Skipped when empty or when the user already exists.
    # Example:
    # user: "linkding"
    user: ""
    # The password associated with the initial admin user.
    # Note: The admin user is created without a usable password when empty.
    # Example:
    # password: "password"
    password: ""

# Database configurations.
db:
  # The database engine or backend being used by Linkding.
  # Note: Accepts "sqlite" or "postgres".
  # Default: "sqlite"
  # Example:
  # type: "postgres"
  type: ""
  # The hostname or IP address of the Linkding database server.
  # Example:
  # host: "linkding.default.svc.cluster.local"
  host: ""
  # The port number the Linkding database server is listening for connections.
  # Note: Only applies when db.type is "postgres".
  # Default: "5432"
  # Example:
  # port: "5433"
  port: ""
  # The name of the database being used by Linkding.
  # Example:
  # name: "linkding"
  name: ""
  # The username or user account for accessing the Linkding database.
  # Example:
  # user: "root"
  user: ""
  # The password associated with the Linkding database user.
  # Example:
  # password: "password"
  password: ""

# Ingress configurations.
ingress:
  # Specifies whether Ingress should be enabled for hosting Linkding services.
  # Example:
  # enabled: true
  enabled: false
  # The name of the cluster issuer for Ingress.
  # Default: "letsencrypt-dns-prod"
  # Example:
  # clusterIssuer: "letsencrypt-http-prod"
  clusterIssuer: ""
  # Specifies whether the WWW subdomain should be enabled.
  # Example:
  # www: true
  www: false
  # Additional configuration annotations to be added to the Ingress resource.
  # Items: `.prefix`, `.name`, `.value`
  # Example:
  # customAnnotations:
  #   # The prefix of the annotation.
  #   # Default: "nginx.ingress.kubernetes.io"
  #   # Example:
  #   # prefix: "nginx.org"
  #   - prefix: ""
  #   # The name of the annotation.
  #   # Example:
  #   # name: "proxy-connect-timeout"
  #     name: ""
  #   # The value of the annotation.
  #   # Example:
  #   # value: "120"
  #     value: ""
  customAnnotations: []

# Service configurations.
service:
  # The optional node port to expose when the service type is NodePort.
  # Example:
  # nodePort: "32000"
  nodePort: ""
  # The port on which the Linkding server should listen for connections.
  # Default: "9090"
  # Example:
  # port: "8080"
  port: ""
  # The type of service used to expose Linkding services.
  # Default: "ClusterIP"
  # Example:
  # type: "NodePort"
  type: ""

# Storage configurations.
storage:
  # Data storage configurations.
  data:
    # Specifies whether persistent storage should be provisioned for data storage.
    # Example:
    # enabled: true
    enabled: false
    # The access mode defining how the data storage can be mounted.
    # Default: "ReadWriteMany"
    # Example:
    # accessMode: "ReadWriteOnce"
    accessMode: ""
    # The path where the data storage should be mounted on the container.
    # Default: "/etc/linkding/data"
    # Example:
    # mountPath: "/data"
    mountPath: ""
    # The subpath within the data storage to mount to the container. Leave empty if not required.
    # Example:
    # subPath: "Data"
    subPath: ""
    # The default amount of persistent storage allocated for the data storage.
    # Default: "1Gi"
    # Example:
    # storage: "10Gi"
    storage: ""
    # The storage class name used for dynamically provisioning a persistent volume for the data storage.
    # Default: "longhorn"
    # Example:
    # storageClassName: "smb"
    storageClassName: ""

# Resource requirements and limits for Linkding containers.
resources:
  # Linkding container resources.
  # Example:
  # linkding:
  #   # The minimum amount of resources required by Linkding to run.
  #   requests:
  #     # The minimum amount of CPU resources required by Linkding.
  #     # Example:
  #     # cpu: "10m"
  #     cpu: "100m"
  #     # The minimum amount of memory required by Linkding.
  #     # Example:
  #     # memory: "10Mi"
  #     memory: "256Mi"
  #   # The maximum amount of resources allowed for Linkding.
  #   limits:
  #     # The maximum amount of CPU resources allowed for Linkding.
  #     # Example:
  #     # cpu: "250m"
  #     cpu: "200m"
  #     # The maximum amount of memory allowed for Linkding.
  #     # Example:
  #     # memory: "250Mi"
  #     memory: "384Mi"
  linkding: {}
